<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="theme-color" content="#7a1d2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ROYAL MANDIR — web invitation (AfterFX Invite Studio layout 2)
   ========================================================= */
:root{
  --maroon:#7a1d2a; --maroon-d:#561320; --maroon-dd:#2c0a10; --accent-rgb:122,29,42;
  --cream:#fbf3e4; --paper:#fffaf0; --gold:#b8893a; --gold-l:#e2bf73; --ink:#4a2a1a; --ink-soft:#7a5a44;
  --teal:#2f6b5c; --rose:#c8506a; --saffron:#e07b39;
  --serif:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#20100a;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
#app{position:relative;max-width:480px;margin:0 auto;background:var(--cream);min-height:100vh;overflow:clip;box-shadow:0 0 80px rgba(0,0,0,.6)}
section{position:relative;width:100%}
.scene{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene.missing{background:radial-gradient(120% 60% at 50% 110%,rgba(var(--accent-rgb),.35),transparent 60%),linear-gradient(180deg,#f8e6c8,#efcf9c 60%,#d9a45e)}
.scene.missing::after{content:attr(data-label);position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:600 11px system-ui,sans-serif;
  color:var(--maroon-d);background:rgba(255,248,235,.9);padding:6px 10px;border-radius:6px;white-space:nowrap}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}.rv.d3{transition-delay:.45s}
.caps{letter-spacing:.3em;text-transform:uppercase;font-weight:500}
.script{font-family:var(--script);font-weight:400}
.h2{font:400 44px/1.05 var(--script);color:var(--maroon);text-align:center}
.sub{font-size:15px;font-style:italic;color:var(--ink-soft);text-align:center;line-height:1.5}
.divider{display:block;width:150px;height:22px;margin:12px auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:30px;text-decoration:none;cursor:pointer;
  background:var(--maroon);color:#f7e2b6;font:600 12px var(--serif);letter-spacing:.2em;text-transform:uppercase;
  box-shadow:0 6px 18px rgba(var(--accent-rgb),.3);border:1px solid var(--gold)}
.btn svg{width:14px;height:14px}
.btn.ghost{background:transparent;color:var(--maroon)}

/* ---------- DOOR: parting curtains ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;pointer-events:auto}
#gate .wrap{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
.curtain{position:absolute;top:0;bottom:0;width:51%;transition:transform 2.2s cubic-bezier(.7,.05,.25,1);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 26px),linear-gradient(180deg,#8a1f2e,#6a1422 55%,#4d0e19);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.curtain::after{content:"";position:absolute;top:0;bottom:0;width:26px;background:
  repeating-linear-gradient(180deg,#e2bf73 0 6px,#b8893a 6px 12px,#f3d58f 12px 14px);opacity:.9}
.curtain.l{left:0}.curtain.l::after{right:0}
.curtain.r{right:0}.curtain.r::after{left:0}
#gate .top{position:absolute;left:0;right:0;top:0;height:120px;z-index:3;pointer-events:none}
#gate.open .curtain.l{transform:translateX(-102%)}
#gate.open .curtain.r{transform:translateX(102%)}
#gate.open{pointer-events:none}#gate.gone{display:none}
#gate .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;transition:opacity .6s}
#gate.open .seal{opacity:0}
.seal .ring{width:190px;height:190px;border-radius:50%;margin:0 auto 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,#fffaf0 0 58%,#f3dfbd 59% 62%,#b8893a 63% 65%,#fff3d6 66% 100%);box-shadow:0 10px 40px rgba(0,0,0,.45);color:var(--maroon)}
.seal .ring .i{font:400 40px/1 var(--script)}
.seal .ring small{font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-top:6px;color:var(--ink-soft)}
#openBtn{font:600 14px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--maroon-d);cursor:pointer;
  padding:13px 28px;border-radius:40px;border:1px solid #fbe7b0;background:linear-gradient(180deg,#f7dc95,#c9a257 60%,#a57a2c);
  box-shadow:0 6px 24px rgba(0,0,0,.5);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 0 12px rgba(201,162,87,0)}}

/* ---------- 1. HERO: temple rises as you scroll ---------- */
#hero{height:230vh;background:var(--cream)}
#hero .stick{position:sticky;top:0;height:100vh;min-height:600px;overflow:hidden}
#hero .skybg{position:absolute;inset:0;background:linear-gradient(180deg,#fdf1dc 0%,#f9ddb4 45%,#f2c287 75%,#e9a867 100%)}
#hero .skybg::after{content:"";position:absolute;left:50%;top:38%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,230,.95),rgba(255,226,170,.45) 45%,transparent 70%)}
#hero .skybg .scene{position:absolute;inset:0}
#hero .temple{position:absolute;left:0;right:0;bottom:0;height:100%;will-change:transform;transform-origin:50% 100%}
#hero .temple .scene{position:absolute;inset:0}
#hero.cut .temple .scene{background-size:100% auto;background-position:50% 100%}
#hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(253,244,226,.95) 0%,rgba(253,244,226,.6) 26%,transparent 46%);pointer-events:none}
#hero .txt{position:absolute;left:0;right:0;top:17%;padding:0 48px;text-align:center;z-index:4;will-change:transform,opacity}
#hero.hassym .txt{top:8%}
#hero .topline{font-size:14px;color:var(--maroon);margin:0 auto 14px;max-width:300px;line-height:1.5}
.symbol{display:block;margin:0 auto 6px;width:auto;object-fit:contain}
.hide{display:none!important}
.symbol.sm{height:52px} .symbol.md{height:72px} .symbol.lg{height:96px}
@media (max-height:700px){.symbol.sm{height:44px}.symbol.md{height:58px}.symbol.lg{height:74px}}
#hero .topline.ar{font:400 26px/1.6 'Amiri',serif}
#hero .nm{font:400 58px/1 var(--script);color:var(--maroon);text-shadow:0 2px 16px rgba(255,250,235,.9)}
#hero .and{font:400 30px/1 var(--script);color:var(--gold);margin:4px 0}
#hero .date{margin-top:14px;font-size:13px;letter-spacing:.32em;color:var(--ink-soft)}
.garland{position:absolute;left:0;right:0;top:0;height:170px;z-index:5;pointer-events:none}
.bells{position:absolute;left:0;right:0;top:0;height:260px;z-index:5;pointer-events:none}
.bell{position:absolute;top:0}.bell:nth-child(1){left:4%}.bell:nth-child(2){left:15%}.bell:nth-child(3){right:15%}.bell:nth-child(4){right:4%}
.bell{width:34px;transform-origin:50% 0;animation:swing 3.6s ease-in-out infinite}
.bell:nth-child(2){animation-duration:4.2s;animation-delay:-1s}.bell:nth-child(3){animation-duration:3.9s;animation-delay:-2s}
.bell:nth-child(4){animation-duration:4.5s;animation-delay:-.6s}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;color:#fff;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center}
.hint::after{content:"";display:block;width:1px;height:34px;margin:8px auto 0;background:linear-gradient(#fff,transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.birds{position:absolute;left:0;right:0;top:22%;height:22%;pointer-events:none;z-index:2;overflow:hidden}
.bird{position:absolute;left:0;top:0;width:26px;height:13px;opacity:.7;animation:fly linear infinite}
.bird svg{width:100%;height:100%;overflow:visible;animation:flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
.bird path{fill:none;stroke:#5a3a28;stroke-width:1.8;stroke-linecap:round}
@keyframes fly{from{transform:translate(var(--x0),var(--y0)) scale(var(--s))}to{transform:translate(var(--x1),var(--y1)) scale(var(--s))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.25)}}

/* ---------- 2. WALK ---------- */
#walk{height:100vh;min-height:600px;overflow:hidden}
#walk .scene{transform:scale(1.1);transition:transform 6s ease-out}
#walk.in .scene{transform:scale(1)}
#walk .cap{position:absolute;left:0;right:0;bottom:0;padding:90px 20px 40px;text-align:center;color:#fff;background:linear-gradient(180deg,transparent,rgba(40,12,6,.72))}
#walk .cap .script{font-size:46px;line-height:1}
#walk .cap .caps{font-size:11px;margin-top:8px;opacity:.9}
#walk .top{position:absolute;left:0;right:0;top:0;height:18%;background:linear-gradient(180deg,var(--cream),transparent)}

/* ---------- 3. INVITATION CARD ---------- */
#card{padding:40px 16px 50px;background:var(--cream);overflow:hidden}
.paper{position:relative;padding:130px 30px 50px;text-align:center;background:
  radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.7),transparent 60%),var(--paper);border-radius:4px;box-shadow:0 18px 40px rgba(90,40,10,.18)}
.paper .archline{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);pointer-events:none}
.paper .icon{width:64px;height:64px;margin:0 auto 6px;color:var(--gold)}
.paper .shloka{font-size:14px;color:var(--maroon);margin-bottom:12px}
.paper .bless{font-size:15px;font-style:italic;color:var(--ink-soft);line-height:1.5}
.paper .who{font-weight:600;color:var(--maroon);font-size:16px;line-height:1.5;margin-top:10px}
.paper .line{font-size:16px;line-height:1.6;margin-top:6px}
.paper .names{font:400 50px/1 var(--script);color:var(--maroon);margin-top:16px}
.paper .names .amp{display:block;font-size:30px;color:var(--gold);margin:4px 0}
.paper .when{margin-top:14px;font-size:13px;letter-spacing:.25em;color:var(--ink-soft);text-transform:uppercase}
canvas.petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ---------- 4. EVENTS INTRO ---------- */
#events{height:92vh;min-height:560px;overflow:hidden}
#events .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,243,228,.96) 0%,rgba(251,243,228,.6) 24%,transparent 44%)}
#events .txt{position:absolute;left:0;right:0;top:9%;text-align:center}
#events .txt .h2{font-size:48px}
#events .fade{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,var(--cream))}

/* ---------- 5. TIMELINE ---------- */
#timeline{background:var(--cream);padding-bottom:40px}
#timeline .hero2{position:relative;height:56vh;min-height:360px;overflow:hidden}
#timeline .hero2 .scene{-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
#timeline .hero2 .scene.missing{-webkit-mask-image:none;mask-image:none}
#timeline .head{position:relative;margin-top:-60px;text-align:center;padding:0 24px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 16px 0}
.tl.one{grid-template-columns:1fr;max-width:260px;margin:0 auto}
.ev{position:relative;text-align:center;padding:40px 10px 18px;background:var(--paper);border-radius:999px 999px 16px 16px;
  box-shadow:0 10px 26px rgba(90,40,10,.14),inset 0 0 0 1px rgba(184,137,58,.55),inset 0 0 0 6px var(--paper),inset 0 0 0 7px rgba(184,137,58,.35)}
.ev::before{content:"";position:absolute;left:50%;top:14px;width:18px;height:18px;transform:translateX(-50%) rotate(45deg);border:1px solid var(--gold);background:#fff6e0}
.ev .n{font:400 30px/1.05 var(--script);color:var(--maroon);margin-top:8px}
.ev .d{font-size:14px;margin-top:6px;line-height:1.35}
.ev .t{font-size:13px;color:var(--ink-soft);font-style:italic}
.ev .pl{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.35}
.ev .route{display:inline-block;margin-top:10px;font:600 10.5px var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);
  text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* ---------- 6. MEET THE COUPLE ---------- */
#couple{background:var(--cream)}
#couple .stage{position:relative;height:78vh;min-height:480px;overflow:hidden}
#couple .stage .scene{transform:scale(1.08);transition:transform 3s cubic-bezier(.2,.7,.2,1)}
#couple.in .stage .scene{transform:none}
#couple .stage .title{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:2}
#couple .stage .title .h2{font-size:52px;text-shadow:0 2px 18px rgba(255,248,235,.95)}
#couple .stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,var(--cream))}
.scallop{position:relative;margin:0 14px;padding:40px 26px 36px;text-align:center;background:var(--paper);
  box-shadow:0 14px 30px rgba(90,40,10,.12)}
.scallop::before{content:"";position:absolute;left:0;right:0;top:-14px;height:15px;
  background:radial-gradient(circle at 15px 15px,var(--paper) 14px,transparent 15px) 0 0/30px 15px repeat-x}
.portrait{width:170px;height:220px;margin:0 auto 18px;border-radius:999px 999px 12px 12px;overflow:hidden;position:relative;
  box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--gold),0 12px 26px rgba(0,0,0,.18)}
.portrait .scene{position:absolute;inset:0}
.scallop .story{font-size:17px;line-height:1.7;margin-top:10px}

/* ---------- 7. GALLERY ---------- */
#gallery{background:var(--cream);padding:56px 0 40px;overflow:hidden}
.board{position:relative;height:560px;margin-top:10px}
.pol{position:absolute;width:44%;padding:8px 8px 30px;background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.2);animation:bob 6s ease-in-out infinite}
.pol .ph{width:100%;aspect-ratio:1/1.1;background:#eee center/cover no-repeat}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(calc(var(--r) * -1 + 1deg))}}

/* ---------- 8. THINGS TO KNOW ---------- */
#faq{background:var(--cream);padding:40px 18px 50px}
.faq{margin-top:18px;display:grid;gap:12px}
.fq{display:flex;gap:14px;align-items:flex-start;background:var(--paper);padding:14px 16px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(184,137,58,.35)}
.fq .ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fdf0da;color:var(--maroon);
  box-shadow:inset 0 0 0 1px rgba(184,137,58,.5)}
.fq .ic svg{width:22px;height:22px}
.fq b{display:block;font-size:17px;color:var(--maroon)}
.fq p{font-size:15px;line-height:1.5;color:var(--ink);margin-top:2px}

/* ---------- RSVP ---------- */
#rsvp{background:var(--cream);padding:24px 18px 40px}
.rcard{background:var(--paper);border:1px solid rgba(184,137,58,.55);border-radius:14px;padding:26px 20px 22px;text-align:center;box-shadow:0 10px 30px rgba(60,20,8,.12)}
.rcard .h2{font-size:40px}
.rnote{font-size:15px;font-style:italic;color:var(--ink-soft);margin:6px 0 4px}
#rForm{display:flex;flex-direction:column;gap:10px;margin-top:14px;text-align:left}
#rForm input,#rForm textarea,#rForm select{width:100%;font:16px var(--serif);color:var(--ink);padding:11px 12px;border:1px solid rgba(184,137,58,.6);border-radius:8px;background:#fffdf8}
#rForm textarea{resize:vertical}
.rchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rchoice button{font:600 14px var(--serif);padding:11px 6px;border-radius:8px;border:1px solid rgba(184,137,58,.6);background:#fffdf8;color:var(--ink);cursor:pointer}
.rchoice button.on{background:var(--maroon);color:#f7e2b6;border-color:var(--maroon)}
.rguests{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink-soft)}
.rguests select{width:90px!important}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
#rForm .btn{align-self:center;margin-top:4px}
.rmsg{min-height:18px;font-size:14px;text-align:center;color:#a0281e}
.rdone{display:none;font-size:18px;color:var(--maroon);padding:18px 6px 6px;line-height:1.5}
.rcard.sent #rForm{display:none}.rcard.sent .rdone{display:block}

/* ---------- 9. COUNTDOWN ---------- */
#count{position:relative;min-height:100vh;overflow:hidden;background:var(--cream)}
#count .scene{top:auto;height:64%;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%)}
#count .scene.missing{-webkit-mask-image:none;mask-image:none}
#count .txt{position:relative;z-index:2;text-align:center;padding:60px 20px 0}
.cd{display:flex;gap:8px;justify-content:center;margin:18px 0 16px}
.cd div{min-width:62px;padding:10px 4px;border-radius:10px;background:rgba(255,250,240,.85);box-shadow:inset 0 0 0 1px rgba(184,137,58,.5)}
.cd b{display:block;font-size:26px;color:var(--maroon);font-weight:600}
.cd span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- 10. VENUE + THANK YOU ---------- */
#venue{position:relative;background:var(--cream);padding:30px 16px 0;overflow:hidden}
.vcard{position:relative;z-index:2;padding:120px 26px 40px;text-align:center;background:var(--paper);box-shadow:0 18px 40px rgba(90,40,10,.18)}
.vcard .archline{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);pointer-events:none}
.vcard .pin{width:22px;height:22px;margin:8px auto;color:var(--maroon)}
.vcard .vn{font-size:20px;font-weight:600;color:var(--maroon)}
.vcard .va{font-size:15px;color:var(--ink-soft);margin:2px 0 14px}
.vcard .ty{font:400 54px/1 var(--script);color:var(--maroon);margin-top:30px}
.vcard .tyl{font-size:15px;color:var(--ink-soft);font-style:italic;margin-top:10px}
.vcard .from{font-size:15px;color:var(--maroon);margin-top:14px}
#venue .base{position:relative;height:46vh;min-height:300px;margin:-80px -16px 0}
#venue .base .scene{-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 40%);mask-image:linear-gradient(180deg,transparent 0%,#000 40%)}
#venue .base .scene.missing{-webkit-mask-image:none;mask-image:none}
footer{background:var(--maroon-d);color:#e9cf98;text-align:center;padding:22px 16px 28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
footer .script{font-size:30px;letter-spacing:0;text-transform:none;color:#f5dfae;display:block;margin-bottom:4px}
.powered{background:var(--maroon-dd);color:#c9a978;text-align:center;padding:14px 16px 18px;font:12px/1.6 system-ui,sans-serif}
.powered a{color:#f3d58f;text-decoration:none;font-weight:600}
.powered .pblogo{height:46px;width:auto;max-width:70%;object-fit:contain;margin-bottom:8px}
.powered .cta{display:inline-block;margin-top:6px;padding:6px 14px;border:1px solid rgba(243,213,143,.45);border-radius:20px;font-size:11.5px}

#music{position:fixed;right:max(14px,calc(50% - 226px));bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);
  background:var(--maroon-d);color:#f3d58f;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#music.show{display:flex}#music svg{width:18px;height:18px}#music.playing svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Indian-language invites */
body.indic,body.indic *{letter-spacing:normal!important;text-transform:none!important}
body.indic{line-height:1.6}
body.indic .h2,body.indic #events .txt .h2{font-size:34px;line-height:1.35}
body.indic #hero .nm{font-size:40px;line-height:1.3}
body.indic .paper .names,body.indic .ev .n,body.indic #walk .cap .script{font-size:30px;line-height:1.35}
body.indic .vcard .ty{font-size:38px}
body.indic footer .script{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body class="locked">

<div id="gate" aria-label="Invitation cover">
  <div class="wrap">
    <div class="curtain l"></div><div class="curtain r"></div>

  $('#rDone').textContent = L.rsvpThanks;
  const sel = form.guests; for (let i = 1; i <= 10; i++) sel.add(new Option(i, i));
  let attending = null; const guestsRow = $('.rguests');
  form.querySelectorAll('.rchoice button').forEach(b => b.onclick = () => {
    attending = b.dataset.a === '1'; form.querySelectorAll('.rchoice button').forEach(x => x.classList.toggle('on', x === b));
    guestsRow.style.display = attending ? '' : 'none';
  });
  const KEY = 'afx-rsvp-' + (CONFIG.rsvpId || '');
  try { if (CONFIG.rsvpId && localStorage.getItem(KEY)) card.classList.add('sent'); } catch (e) {}
  form.onsubmit = async ev => {
    ev.preventDefault(); msg.textContent = '';
    if (!form.name.value.trim()){ form.name.focus(); return; }
    if (attending === null){ msg.textContent = '👆 ' + L.rsvpYes + ' / ' + L.rsvpNo; return; }
    if (!CONFIG.rsvpUrl){ msg.textContent = 'RSVP starts working after the invite is published.'; return; }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const r = await fetch(CONFIG.rsvpUrl, { method: 'POST', headers: { 'content-type': 'text/plain' },
        body: JSON.stringify({ name: form.name.value, attending, guests: attending ? +sel.value : 0, phone: form.phone.value, message: form.message.value, website: form.website.value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not send, please try again');
      card.classList.add('sent'); try { localStorage.setItem(KEY, '1'); } catch (e) {}
    } catch (x){ msg.textContent = x.message || 'Could not send, please try again'; }
    finally { btn.disabled = false; }
  };
})();

// marigold garlands + hanging bells (drawn, so they work with any picture)
function garland(svg, W, H, strands){
  let out = '';
  strands.forEach(([x0, x1, sag, y]) => {
    const cx = (x0 + x1) / 2, cy = y + sag;
    out += `<path d="M${x0} ${y} Q${cx} ${cy * 2 - y} ${x1} ${y}" stroke="#6a8a3a" stroke-width="2" fill="none"/>`;
    for (let t = 0; t <= 1.0001; t += 1 / 16){
      const px = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
      const py = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * (cy * 2 - y) + t * t * y;
      const c = ['#f59e0b', '#f97316', '#fbbf24', '#e11d48'][Math.round(t * 16) % 4];
      out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="8.5" fill="${c}"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="#b45309" opacity=".6"/>`;
    }
  });
  svg.innerHTML = out;
}
garland($('#gateGarland'), 480, 120, [[-10, 250, 34, 6], [230, 490, 34, 6]]);
garland($('#heroGarland'), 480, 170, [[-20, 170, 30, 4], [150, 330, 38, 4], [310, 500, 30, 4]]);

  <g transform="translate(0 ${h - 46})"><circle cx="17" cy="4" r="4" fill="#c9a257"/><path d="M5 30 Q5 8 17 8 Q29 8 29 30 L32 34 L2 34 Z" fill="#c9a257" stroke="#8a6424"/>

// hero: temple rises, names float away
(function(){
  const hero = $('#hero'), temple = $('#hero .temple'), txt = $('#hero .txt'), hint = $('#hero .hint');
  let ticking = false;
  function upd(){
    ticking = false;
    const r = hero.getBoundingClientRect(), span = hero.offsetHeight - innerHeight;
    const p = Math.max(0, Math.min(1, -r.top / Math.max(1, span)));
    temple.style.transform = `translateY(${(1 - p) * 38}%) scale(${1.12 - .12 * p})`;
    txt.style.transform = `translateY(${-p * 60}px)`; txt.style.opacity = String(Math.max(0, 1 - Math.max(0, p - .45) * 2.4));
    hint.style.opacity = String(Math.max(0, 1 - p * 4));
  }
  addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(upd); } }, { passive: true });
  addEventListener('resize', upd); upd();
})();

// countdown + calendar
function tick(){
  const ms = new Date(CONFIG.weddingAt) - Date.now(), el = $('#cd');
  if (isNaN(ms)){ el.remove(); return; }
  if (ms <= 0){ el.innerHTML = `<div style="padding:10px 16px"><b style="font-size:20px">${esc(L.today)}</b></div>`; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  el.innerHTML = [[d, L.days], [h, L.hrs], [m, L.min], [s, L.sec]].map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${esc(l)}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

  if (isNaN(t)){ $('#calBtn').remove(); return; }
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  $('#calBtn').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Wedding of ' + couple) +
    '&dates=' + f(t) + '/' + f(new Date(t.getTime() + 3 * 3600e3)) + '&location=' + encodeURIComponent([CONFIG.venue.name, CONFIG.venue.address].filter(Boolean).join(', ')) +
    '&details=' + encodeURIComponent(location.href.split('?')[0]);

// falling petals over the invitation card
(function(){
  if (!CONFIG.petals || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#card canvas.petals'), ctx = cv.getContext('2d'), colors = ['#f59e0b', '#fbbf24', '#e11d48', '#f472b6', '#fff7e6', '#f97316'];
  let W, H, run = false, P = [];
  const size = () => { const dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const make = top => ({ x: Math.random() * W, y: top ? -20 : Math.random() * H * .5, r: 4 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)],
    vy: .5 + Math.random(), vx: -.3 + Math.random() * .6, a: Math.random() * 6.28, va: -.04 + Math.random() * .08, sw: Math.random() * 6.28 });
  function frame(){
    if (!run) return; ctx.clearRect(0, 0, W, H);
    for (const p of P){ p.sw += .02; p.x += p.vx + Math.sin(p.sw) * .5; p.y += p.vy; p.a += p.va; if (p.y > H + 20) Object.assign(p, make(true));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); ctx.fill(); ctx.restore(); }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size); P = Array.from({ length: 30 }, () => make(false));
  new IntersectionObserver(es => es.forEach(e => { const was = run; run = e.isIntersecting; if (run && !was) requestAnimationFrame(frame); })).observe($('#card'));
})();

const QS = new URLSearchParams(location.search), DEMO = QS.has('demo');
function tapFx(el){ if (!el) return; const r = el.getBoundingClientRect(), d = document.createElement('div'); d.className = 'tapfx';
  d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + r.height / 2) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }

    box-shadow:0 0 0 2px rgba(255,255,255,.9),0 2px 12px rgba(0,0,0,.35);animation:tapfx .8s ease-out forwards}@keyframes tapfx{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .finger{position:fixed;z-index:98;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.8) 0 40%,rgba(255,255,255,.25) 60%,transparent 70%);box-shadow:0 2px 10px rgba(0,0,0,.25);transition:opacity .3s}.finger.on{opacity:1}
    #rForm input.typing{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,58,.25)}`;
  document.head.appendChild(st);
  $('#openBtn').addEventListener('pointerdown', e => tapFx(e.currentTarget));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function glide(toY, ms){
  return new Promise(res => {
    const from = scrollY, dist = Math.max(0, Math.min(toY, document.documentElement.scrollHeight - innerHeight)) - from, t0 = performance.now();
    const fg = QS.has('nofinger') ? null : ($('.finger') || document.body.appendChild(Object.assign(document.createElement('div'), { className: 'finger' })));
    if (fg && Math.abs(dist) > 60) fg.classList.add('on');
    const step = now => { const p = Math.min(1, (now - t0) / ms), e = .5 - Math.cos(Math.PI * p) / 2; scrollTo(0, from + dist * e);
      if (fg) fg.style.top = (innerHeight * (.78 - .42 * e)) + 'px'; if (p < 1) requestAnimationFrame(step); else { if (fg) fg.classList.remove('on'); res(); } };
    requestAnimationFrame(step);
  });
}
const yOf = (el, mode) => { if (!el) return null; const r = el.getBoundingClientRect(), top = r.top + scrollY; return mode === 'top' || r.height > innerHeight ? top - (mode === 'top' ? 0 : 20) : top - (innerHeight - r.height) / 2; };
async function visit(sel, pause, mode){ const el = typeof sel === 'string' ? $(sel) : sel; const y = yOf(el, mode); if (y == null) return;
  await glide(y, Math.min(3200, Math.max(1400, Math.abs(y - scrollY) * 2.2))); await wait(pause); }
async function typeInto(inp, text){ inp.classList.add('typing'); for (const ch of text){ inp.value += ch; await wait(110); } inp.classList.remove('typing'); }
async function runDemo(){
  await wait(1200);
  const hero = $('#hero'); await glide(hero.offsetHeight - innerHeight, 5200); await wait(1200);
  await visit('#walk', 2200, 'top');
  await visit('#card .paper', 3000);
  await visit('#events', 2000, 'top');
  if ($('#timeline')){ await visit('#timeline .head', 800); await visit('#tl', 2400); }
  await visit('#couple .stage', 1800, 'top');
  if ($('#couple .scallop')) await visit('#couple .scallop', 2000);
  if ($('#gallery')) await visit('#board', 2400);
  if ($('#faq')) await visit('#faqList', 2200);
  if ($('#rsvp')){
    await visit('.rcard', 900); const f = $('#rForm');
    if (f && !$('.rcard').classList.contains('sent')){ f.name.value = ''; await typeInto(f.name, 'Ravi Kumar'); await wait(400);
      const yes = f.querySelector('.rchoice button[data-a="1"]'); tapFx(yes); yes.click(); await wait(700); f.guests.value = '4'; await wait(1600); }
  }
  await visit('#count .txt', 2600);
  await visit('#venue .vcard', 1200);
  const mb = $('#vMap'); if (mb){ tapFx(mb); mb.animate([{ transform: 'scale(1)' }, { transform: 'scale(.94)' }, { transform: 'scale(1)' }], { duration: 350 }); }
  await wait(2000);
  await glide(document.documentElement.scrollHeight, 2400); await wait(2000);
  await glide(0, 3500);
}
