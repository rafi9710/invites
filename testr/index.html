<style>
/* =========================================================
   ROYAL ENVELOPE — web invitation (AfterFX Invite Studio layout 6)
   Layered scroll: full-screen envelope → couple walking → card →
   wedding → pre-wedding celebrations → venue
   ========================================================= */
:root{
  --maroon:#5a0b18; --maroon-2:#7a1527; --maroon-3:#3d0710;
  --cream:#f8ece0; --blush:#f4e1d4; --ink:#5a3a2e; --ink-soft:#86675a;
  --gold:#b8893a; --gold-2:#e9c46a; --gold-3:#8a6020;
  --f-names:'Cinzel',Georgia,serif; --f-body:'Cormorant Garamond',Georgia,serif; --f-script:'Pinyon Script',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#2a1610;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
#app{position:relative;max-width:480px;margin:0 auto;background:var(--cream);overflow:clip;box-shadow:0 0 80px rgba(0,0,0,.5)}
img{display:block;max-width:100%}
.script{font-family:var(--f-script);font-weight:400;line-height:1.05}
.caps{font-family:var(--f-names);letter-spacing:.14em;text-transform:uppercase}
.mark{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:10px auto}
.mark::before,.mark::after{content:"";height:1px;width:52px;background:currentColor;opacity:.7}
.mark svg{width:16px;height:12px;fill:currentColor}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:0;font-family:var(--f-names);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:var(--maroon);color:var(--gold-2);box-shadow:0 6px 16px rgba(60,10,10,.25)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translateY(24px);filter:blur(4px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s ease}
.rv.in{opacity:1;transform:none;filter:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}
.fade-top{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20%);mask-image:linear-gradient(180deg,transparent 0,#000 20%)}
.fade-both{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent)}
.paper{background:
  radial-gradient(ellipse at 20% 8%,rgba(255,255,255,.6),transparent 55%),
  radial-gradient(ellipse at 85% 92%,rgba(214,170,140,.2),transparent 60%),
  linear-gradient(180deg,#faefe4,#f4e2d3)}
.scene{background:center/cover no-repeat}
/* a foreground layer that slides past the text faster than the page (depth) */
.fgwrap{position:relative;height:0;z-index:6;pointer-events:none}
.fgwrap img{position:absolute;left:-12%;width:124%;max-width:none;top:-30vh;will-change:transform}

/* ---------- 0 · envelope on a scene ---------- */
#gate{position:fixed;inset:0;z-index:50;overflow:hidden;background:#3a1d14}
#gate .stage{position:absolute;inset:0;margin:0 auto;max-width:480px;overflow:hidden;perspective:1100px;perspective-origin:50% 20%;transform-origin:var(--zo,50% 55%);transition:transform 2.6s cubic-bezier(.33,0,.25,1) .15s}
#gate.open .stage{transform:scale(1.18)}
.g-bg{position:absolute;inset:0;background:center top/cover no-repeat;transition:transform 4.2s ease}
.g-bg.plain{background:
  radial-gradient(ellipse 70% 40% at 20% 0%,rgba(214,150,110,.45),transparent 70%),
  radial-gradient(ellipse 60% 40% at 90% 10%,rgba(190,60,70,.35),transparent 70%),
  linear-gradient(180deg,#efd9c2,#e5c6a6)}
.g-fg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;pointer-events:none;z-index:6}
.env{position:absolute;transform-style:preserve-3d;z-index:2;transition:transform 2s cubic-bezier(.5,0,.3,1) 2.2s}
.env > div{position:absolute;left:0;right:0}
.paperk{background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  linear-gradient(180deg,#e9d3ba,#dcc0a0)}
.e-back{top:0;bottom:0;border-radius:6px;box-shadow:0 30px 60px rgba(40,15,8,.45),0 0 0 1px rgba(120,80,50,.15)}
.e-in{top:0;bottom:0;background:linear-gradient(180deg,#3d2318,#5a3424 60%,#6b4029)}
.e-front{top:0;bottom:0;filter:drop-shadow(0 -4px 6px rgba(40,15,8,.25))}
.e-front svg{position:absolute;inset:0;width:100%;height:100%}
.e-fw{top:0;transform-origin:50% 0;transform-style:preserve-3d;transition:transform 2.1s cubic-bezier(.4,0,.2,1) .15s;z-index:4}
.e-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.e-face.f{background:
  radial-gradient(ellipse at 25% 12%,rgba(255,255,255,.75),transparent 55%),
  radial-gradient(ellipse at 85% 80%,rgba(214,180,150,.3),transparent 60%),
  linear-gradient(180deg,#fbf3e8,#f2e3cf);background-size:cover;background-position:center;filter:drop-shadow(0 8px 10px rgba(40,15,8,.3))}
.e-face.b{transform:rotateX(180deg)}
.e-deco{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;backface-visibility:hidden}
.g-ftxt{position:absolute;left:12%;right:12%;top:14%;text-align:center;color:var(--ink);backface-visibility:hidden}
.g-ftxt .rule{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold-3);margin:4px 0}
.g-ftxt .rule::before,.g-ftxt .rule::after{content:"";height:1px;width:40px;background:currentColor;opacity:.6}
.g-ftxt .rule svg{width:18px;height:12px;fill:currentColor}
.g-ftxt .l1{font-size:clamp(14px,4vw,18px);line-height:1.35;font-style:italic;color:#4a3328;margin:6px 0}
.g-ftxt .l2{font-family:var(--f-names);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-3);margin-top:2px}
.seal{position:absolute;left:50%;top:var(--sealTop,60%);width:var(--sealW,130px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:7;border:0;border-radius:50%;cursor:pointer;background:transparent;transition:transform .5s ease,opacity .5s ease}
.seal .wax{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 35% 30%,#a8323c,#6a1220 55%,#430811);box-shadow:inset 0 0 0 7px rgba(0,0,0,.14),inset 0 0 0 12px rgba(255,255,255,.04),0 10px 18px rgba(40,5,5,.5);display:flex;align-items:center;justify-content:center;font-family:var(--f-script);font-size:42px;color:#e8c38c;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.seal img{position:absolute;inset:-6%;width:112%;height:112%;max-width:none;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(40,5,5,.5))}
.seal.has-img .wax{display:none}
.seal .tassel{position:absolute;left:50%;top:84%;width:8px;height:44px;margin-left:-4.5px;background:linear-gradient(90deg,#b8862f,#f6dc8e,#b8862f);border-radius:3px;transform-origin:50% 0;animation:sway 3s ease-in-out infinite;z-index:-1}
.seal .tassel::before{content:"";position:absolute;left:-6px;right:-6px;top:30px;height:10px;border-radius:5px;background:linear-gradient(90deg,#a87523,#f2d27c,#a87523)}
.seal .tassel::after{content:"";position:absolute;left:-9px;right:-9px;bottom:-30px;height:34px;background:repeating-linear-gradient(90deg,#e0b65a 0 2px,#a97a25 2px 3px);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);border-radius:0 0 4px 4px}
@keyframes sway{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
.seal::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(255,235,200,.7);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.3);opacity:0}}
.gate-hint{position:absolute;right:calc(var(--ex,10%) + 4%);top:var(--hintTop,80%);text-align:right;color:#5a3a2e;z-index:5;transform:rotate(-3deg)}
.gate-hint small{display:block;font-family:var(--f-names);font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-right:24px}
.gate-hint .script{font-size:36px;line-height:1}
#gate.open .e-fw{transform:rotateX(178deg)}
/* picture mode: the flap is a cut-out PNG from the same painting as the background */
.fimg{position:absolute;inset:0;z-index:4;transform-style:preserve-3d;transition:transform 2.5s cubic-bezier(.45,0,.35,1) .1s;display:none;will-change:transform}
.fimg img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 8px 10px rgba(40,15,8,.3))}
.fimg .fb{position:absolute;inset:0;transform:rotateX(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  -webkit-mask-size:cover;mask-size:cover;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.fimg .g-ftxt{position:absolute;backface-visibility:hidden}
.fin{position:absolute;inset:0;z-index:3;display:none;transition:transform 4.2s ease;
  background:linear-gradient(33deg,transparent 49.6%,rgba(255,236,210,.22) 50%,rgba(60,30,15,.18) 50.6%,transparent 52%),linear-gradient(-33deg,transparent 49.6%,rgba(255,236,210,.22) 50%,rgba(60,30,15,.18) 50.6%,transparent 52%),radial-gradient(90% 75% at 50% 90%,#c49a72 0%,#a87a55 45%,#7a5034 100%);
  -webkit-mask-size:cover;mask-size:cover;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.fin::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,18,8,.5),rgba(40,18,8,.12) 25%,transparent 50%),repeating-linear-gradient(90deg,rgba(255,220,180,.025) 0 2px,transparent 2px 5px)}
#gate.imgmode .fin{display:block}

/* opening VIDEO (the "+ Add video" on the painting slot): the real flap-opening clip plays on tap */
.g-vid{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;z-index:1;opacity:0;pointer-events:none}
#gate.vplay .g-vid{z-index:5}
#gate.vidmode.vplay .g-vid,#gate.vidonly .g-vid{opacity:1}
#gate.pure .g-vid{z-index:6;opacity:1}
#gate.pure #env,#gate.pure .fimg,#gate.pure .fin,#gate.pure .gate-hint,#gate.pure .g-fg{display:none!important}
#gate.pure .seal{left:0;top:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;transform:none!important;opacity:0!important;z-index:9}

#gate.vidmode.vplay .fimg,#gate.vidmode.vplay .fin,#gate.vidmode.vplay #env{visibility:hidden}
#gate.vidmode.open .fimg,#gate.vidmode.imgmode.open .fimg{transform:none!important;transition:none!important}
#gate.vidmode .fimg img{filter:none}   /* the clip has no shadow: keep the closed picture identical to its first frame */
#gate.vidmode:not(.imgmode) #env{display:none}
#gate.vidmode.open .stage{transform:none}
#gate.vidmode.open .g-ftxt{opacity:0;transition:opacity .35s}
#gate.vidmode .flash{transition:opacity .5s ease}
#gate.vidmode.open .flash{opacity:0}
#gate.vidmode.fl .flash{opacity:1}
#gate.imgmode #env{display:none}
#gate.imgmode .fimg{display:block}
#gate.imgmode .g-bg{background-position:center}
#gate.imgmode.open .fimg{transform:translateY(-30%) rotateX(-58deg) scale(1.12)}   /* like the reel: the flap lifts away and up out of the frame, front side always facing us */
#gate.open .seal{pointer-events:none}
#gate.open:not(.imgmode) .seal{opacity:0;transition:opacity .6s ease}
#gate.open .gate-hint{opacity:0;transition:opacity .3s}

#gate .flash{position:absolute;inset:0;background:#f3e4d0;opacity:0;pointer-events:none;transition:opacity .45s ease 2.05s;z-index:20}
#gate.open .flash{opacity:1}
#gate.gone{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}

/* ---------- 1 · together (background + couple legs layer) ---------- */
#hero{position:relative;height:185vh}
#hero .stick{position:sticky;top:0;height:100vh;min-height:560px;overflow:hidden;background:var(--cream)}
#hero .h-bg{position:absolute;inset:0 0 -12% 0;background:linear-gradient(180deg,#e9cdb1,#f3e2d2 55%,var(--cream)) center top/cover no-repeat;will-change:transform}
#hero .legs{position:absolute;left:0;top:-4%;width:100%;max-width:none;will-change:transform,opacity;opacity:0;transition:opacity .7s ease;z-index:2}
body.opened #hero .legs{opacity:1}
body.opened #hero .stick{animation:heroIn 2s cubic-bezier(.2,.6,.2,1) both}
@keyframes heroIn{from{transform:scale(1.14)}to{transform:none}}
#hero .copy{position:absolute;left:0;right:0;bottom:11%;text-align:center;padding:0 24px;z-index:3;will-change:transform}
#hero .big{font-family:var(--f-names);font-size:clamp(34px,11vw,52px);letter-spacing:.18em;color:var(--ink);line-height:1;font-weight:400}
#hero .sub{font-family:var(--f-names);font-size:11px;letter-spacing:.34em;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--f-names);font-size:10px;letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase;z-index:3}
.hint i{display:block;width:12px;height:12px;margin:6px auto 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px) rotate(45deg)}}

/* ---------- 2 · invitation card ---------- */
#invite{position:relative;text-align:center;padding:40px 30px 0;overflow:hidden}
#invite .leaf{position:absolute;width:42%;pointer-events:none;z-index:4}
#invite .leaf.tr{right:-10%;top:28%;transform:scaleX(-1)}
#invite .leaf.bl{left:-12%;top:58%}
#invite .names{font-size:clamp(50px,15vw,68px);color:var(--ink)}
#invite .names .n{display:block;white-space:nowrap}
#invite .names .amp{display:block;font-size:.55em;color:var(--ink-soft);margin:-2px 0}
#invite .date{font-family:var(--f-names);font-size:14px;letter-spacing:.2em;color:var(--ink);margin-top:10px;text-transform:uppercase}
#invite .place{font-size:13px;letter-spacing:.24em;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.sym{width:58px;height:auto;margin:20px auto 2px}
.sym.sm{width:42px}.sym.lg{width:84px}
#invite .bless{font-family:var(--f-names);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);line-height:1.7;max-width:28ch;margin:4px auto 0}
#invite .grand,#invite .parents{font-family:var(--f-names);font-size:15px;letter-spacing:.04em;color:var(--ink);margin-top:12px;line-height:1.5}
#invite .line{font-size:17px;color:var(--ink-soft);max-width:30ch;margin:14px auto 0;line-height:1.45;font-style:italic}
.full{position:relative;margin:24px 0 8px;display:grid;gap:2px}
.full .nm{font-family:var(--f-script);font-size:clamp(40px,12vw,54px);color:var(--ink);white-space:nowrap;line-height:1.1}
.full .par{font-size:14px;color:var(--ink-soft);line-height:1.3;font-family:var(--f-names);letter-spacing:.06em}
.full .par:empty{display:none}
.full .amp{font-family:var(--f-script);font-size:30px;color:var(--ink-soft);line-height:1}
#invite .kalasam{position:absolute;right:-6%;bottom:-6%;width:40%;pointer-events:none;z-index:3}
#invite .base{position:relative;margin:30px -30px 0;height:64vh;min-height:390px;background:linear-gradient(180deg,transparent,#a3242a 30%,#7a1a1e) center bottom/cover no-repeat}

/* ---------- 3 · wedding ---------- */
#wed{position:relative;text-align:center;overflow:hidden;background:linear-gradient(180deg,#f8e8df 0%,#f6cdbd 22%,#f0a088 46%,#d86a55 70%,#8a3633)}
#wed .clouds{position:absolute;inset:0;background:center top/cover no-repeat;pointer-events:none}
#wed .clouds.plain{background:radial-gradient(ellipse 60% 14% at 18% 22%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 50% 12% at 82% 34%,rgba(255,240,230,.45),transparent 70%)}
#wed .copy{position:relative;z-index:2;padding:60px 24px 0}
#wed .script{font-size:clamp(64px,19vw,90px);color:var(--ink)}
#wed .date{font-family:var(--f-names);font-size:14px;letter-spacing:.18em;color:var(--maroon-3);margin-top:4px;text-transform:uppercase}
#wed .time{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--maroon-2)}
#wed .where{font-family:var(--f-names);font-size:16px;letter-spacing:.14em;color:var(--maroon-3);margin-top:10px;text-transform:uppercase}
#wed .addr{font-size:14px;letter-spacing:.12em;color:var(--maroon-2);text-transform:uppercase}
#wed .mandap{position:relative;height:82vh;min-height:480px;margin-top:-8vh;background:center bottom/cover no-repeat}
#wed .aisle{position:relative;height:100vh;min-height:560px;overflow:hidden}
#wed .aisle i{position:absolute;inset:-10% 0;background:center/cover no-repeat;will-change:transform}

/* ---------- 4 · pre-wedding celebrations ---------- */
#events{position:relative;padding:54px 0 0;text-align:center;overflow:hidden}
.pl{position:absolute;top:0;width:24%;background:center top/100% auto repeat-y;pointer-events:none;z-index:3}
.pl.l{left:-6%}.pl.r{right:-6%;transform:scaleX(-1)}
#events .pl{bottom:30vh}
#events .head{position:relative;z-index:2}
#events .head .our{display:block;font-size:30px;color:var(--ink-soft);line-height:1;margin-bottom:-6px}
#events .head .big{font-size:clamp(52px,15vw,70px);color:var(--ink)}
#events .head .caps{font-size:12px;letter-spacing:.38em;color:var(--ink-soft);margin-top:2px}
#evList{position:relative;z-index:2;display:grid;gap:26px;padding:28px 22px 14px}
#events.has-pl #evList{padding:28px 22% 14px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left}
.ev .ic{width:52px;height:52px;color:var(--gold-3);display:flex;align-items:center;justify-content:center}
.ev .ic img{width:100%;height:100%;object-fit:contain}
.ev .ic svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ev .nm{font-family:var(--f-script);font-size:34px;color:var(--ink);line-height:1.05}
.ev-when{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.ev-when .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--chip-bg,var(--maroon));color:var(--chip-fg,var(--gold-2));font-family:var(--f-ev,var(--f-names));font-size:12px;letter-spacing:.04em;line-height:1.25}
.ev-when .chip svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.chip-plain .ev-when .chip{background:none;padding:0 6px 0 0;color:var(--ink);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.ev .pl2{font-size:14px;color:var(--ink-soft);line-height:1.3}
.ev .lk{display:inline-block;margin-top:3px;font-family:var(--f-names);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);text-decoration:none;border-bottom:1px solid var(--gold)}
#events .base{position:relative;height:56vh;min-height:330px;margin-top:20px;background:linear-gradient(180deg,transparent,#c9925f 40%,#7a3e22) center bottom/cover no-repeat;z-index:2}

/* ---------- 5 · venue ---------- */
#venue{position:relative;text-align:center;padding:60px 0 0;overflow:hidden}
#venue .pl{bottom:60vh}
#venue .copy{padding:0 26%;position:relative;z-index:2}
#venue:not(.has-pl) .copy{padding:0 30px}
#venue .k{font-size:13px;letter-spacing:.42em;color:var(--ink)}
#venue .vn{font-family:var(--f-names);font-size:clamp(22px,7vw,30px);letter-spacing:.1em;color:var(--ink);margin-top:8px;line-height:1.2;text-transform:uppercase}

.pol .pc{background:#fffdf8;padding:7px 7px 22px;box-shadow:0 8px 20px rgba(60,30,10,.22);border-radius:2px}

html{scroll-behavior:auto}

#hero{height:205vh;background:var(--cream)}

#hero .big{letter-spacing:.16em}

/* Card: the reel breathes before the text enters. */
#invite{min-height:148vh;padding-top:14vh;padding-bottom:0}

#invite .base{height:68vh;min-height:430px;margin-top:34px}

/* Wedding: layered sky, mandapam and aisle create the same depth-first motion. */
#wed{min-height:185vh}
#wed .copy{position:sticky;top:0;min-height:42vh;padding-top:12vh;display:flex;flex-direction:column;justify-content:flex-start;pointer-events:none}

#wed .aisle{height:86vh;min-height:520px;margin-top:-8vh}

/* Celebrations: airy reveal, side pillars drift at a different rate. */
#events{min-height:155vh;padding-top:12vh}

#events .pl{will-change:transform}
#events #evList{padding-top:36px}
#events .base{height:62vh;min-height:380px;margin-top:28px}
#events .fgwrap img{will-change:transform}

/* Venue: large scenic landing with copy that arrives before the image. */
#venue{min-height:140vh;padding-top:12vh}
#venue .copy{position:sticky;top:0;padding-top:4vh;min-height:48vh;display:flex;flex-direction:column;align-items:center}
#venue .scene{height:78vh;min-height:460px;margin-top:-8vh;transform:scale(1.04);transform-origin:50% 100%;will-change:transform}

/* Keep the later utility sections elegant while preserving their existing IDs/content. */
#couple,#count,#rsvp,#magic{scroll-margin-top:0}
#couple{padding-top:72px;padding-bottom:64px}
#count{padding-top:68px;padding-bottom:68px}
#rsvp{padding-top:68px;padding-bottom:68px}
#magic{padding-top:68px;padding-bottom:72px}

@media (max-width:480px){

      const k = parseFloat(e.dataset.par) || 0; e.style.transform = `translate3d(0,${(b.top + b.height / 2 - H / 2) * k}px,0)`; });

    /* Section-level camera motion: each major scene scales slightly while it
       crosses the viewport, giving the slow cinematic push used in the reel. */
    [['#invite',1.035],['#wed',1.028],['#events',1.025],['#venue',1.03]].forEach(([sel,maxScale]) => {
