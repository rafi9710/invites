<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="theme-color" content="#5a1414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CHETTINAD HERITAGE — web invitation
   Edit the CONFIG block in the <script> at the bottom.
   ========================================================= */
:root{
  --maroon:#6b1616; --maroon-d:#4a0e0e; --cream:#f6ecd9; --paper:#fbf4e6;
  --gold:#b8893a; --gold-l:#e2bf73; --ink:#4a2a1a; --ink-soft:#7a5a44;
  --teal:#2f6b5c; --serif:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1c0b07;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
img{display:block;max-width:100%}

/* phone-width column, centred on desktop */
#app{position:relative;max-width:480px;margin:0 auto;background:var(--cream);min-height:100vh;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)}

/* ---------- scene image with graceful placeholder ---------- */
.scene{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.scene.missing{background:
  radial-gradient(120% 60% at 50% 110%, rgba(107,22,22,.55), transparent 60%),
  linear-gradient(180deg,#f3dfbd 0%,#e8c996 55%,#b8893a 100%)}
.scene.missing::after{content:attr(data-label);position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  font:600 11px/1.3 system-ui,sans-serif;letter-spacing:.04em;color:#4a0e0e;background:rgba(255,248,235,.85);
  padding:6px 10px;border-radius:6px;white-space:nowrap}

.rv{opacity:0;transform:translateY(28px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}.rv.d3{transition-delay:.45s}.rv.d4{transition-delay:.6s}

section{position:relative;width:100%;overflow:hidden}

/* =========================================================
   0. GATE — carved Chettinad double door
   ========================================================= */
#gate{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;perspective:1600px;pointer-events:auto}
#gate .frame{position:relative;width:100%;max-width:480px;height:100%;
  background:linear-gradient(90deg,#3a1a0c,#5b2a12 8%,#3a1a0c 16%,#3a1a0c 84%,#5b2a12 92%,#3a1a0c)}
#gate .lintel{position:absolute;left:0;right:0;top:0;height:14%;z-index:3;
  background:
    repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.25) 22px 24px),
    linear-gradient(180deg,#6d3517,#4a220d 70%,#2e1407);
  border-bottom:6px solid #2a1206;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#gate .lintel::after{content:"";position:absolute;left:50%;top:22%;width:64px;height:64px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#f3d58f 0 18%,#b8893a 19% 32%,#6d3517 33% 40%,#c9a257 41% 48%,transparent 49%)}
.leaf{position:absolute;top:14%;bottom:0;width:50%;transform-style:preserve-3d;
  transition:transform 2.2s cubic-bezier(.6,.05,.25,1);
  background:
    linear-gradient(90deg,rgba(0,0,0,.25),transparent 12%,transparent 88%,rgba(0,0,0,.3)),
    repeating-linear-gradient(0deg,#6a3417 0 3px,#733a1a 3px 7px,#65301a 5px 9px),
    #6a3417;
  display:grid;grid-template-rows:repeat(4,1fr);gap:14px;padding:18px 16px;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.leaf.l{left:0;transform-origin:left center;border-right:2px solid #2a1206}
.leaf.r{right:0;transform-origin:right center;border-left:2px solid #2a1206}
.panel{position:relative;border-radius:4px;
  background:
    radial-gradient(circle at 50% 50%,#c9a257 0 6px,#8a5a22 7px 9px,transparent 10px),
    linear-gradient(135deg,#7d421c,#51250e);
  box-shadow:inset 3px 3px 0 rgba(255,210,150,.15),inset -4px -4px 0 rgba(0,0,0,.4),0 0 0 3px #3e1c0a,0 0 0 5px #7d421c}
.panel::before,.panel::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fbe7b0,#b8893a 55%,#6d4a15)}
.panel::before{left:8px;top:8px}.panel::after{right:8px;bottom:8px}
.knock{position:absolute;top:52%;width:54px;height:54px;border-radius:50%;border:6px solid #c9a257;
  box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 0 0 2px #7a5316;z-index:2}
.leaf.l .knock{right:14px}.leaf.r .knock{left:14px}
.knock::before{content:"";position:absolute;left:50%;top:-16px;width:18px;height:18px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fbe7b0,#b8893a 60%,#6d4a15)}
#gate.open .leaf.l{transform:rotateY(-108deg)}
#gate.open .leaf.r{transform:rotateY(108deg)}
#gate.open{pointer-events:none}
#gate.gone{display:none}
#gate .glow{position:absolute;left:50%;top:14%;bottom:0;width:0;transform:translateX(-50%);
  background:linear-gradient(180deg,#fff3c9,#ffd37a);filter:blur(10px);opacity:0;transition:width 1.6s ease,opacity 1.6s ease;z-index:1}
#gate.open .glow{width:100%;opacity:1}
#gate .cta{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:5;text-align:center;transition:opacity .6s}
#gate.open .cta{opacity:0}
#gate .cta small{display:inline-block;white-space:nowrap;color:#f3d58f;letter-spacing:.3em;font-size:12px;margin-bottom:14px;text-transform:uppercase;padding:6px 14px;border-radius:20px;background:rgba(30,10,4,.7)}
#openBtn{font:600 15px var(--serif);letter-spacing:.18em;text-transform:uppercase;color:#4a0e0e;cursor:pointer;
  padding:14px 30px;border-radius:40px;border:1px solid #fbe7b0;
  background:linear-gradient(180deg,#f7dc95,#c9a257 60%,#a57a2c);box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 0 6px rgba(201,162,87,.18);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 0 14px rgba(201,162,87,0)}}

/* =========================================================
   1. HERO — mansion facade
   ========================================================= */
#hero{height:100vh;min-height:640px}
#hero .scene{animation:kb 22s ease-in-out infinite alternate;transform-origin:50% 70%}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
#hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(250,240,220,.92) 0%,rgba(250,240,220,.55) 30%,transparent 52%)}
#hero .txt{position:absolute;left:0;right:0;top:9%;text-align:center;color:var(--ink)}
.caps{font-family:var(--serif);font-weight:500;letter-spacing:.32em;text-transform:uppercase}
#hero .name{font-size:clamp(30px,9vw,42px);line-height:1.05}
#hero .weds{font-family:var(--script);font-size:clamp(30px,9vw,40px);color:var(--gold);line-height:1;margin:4px 0}
#hero .date{margin-top:14px;font-size:13px;letter-spacing:.3em;color:var(--ink-soft)}
.scroll-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#fff;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center;opacity:.9}
.scroll-hint::after{content:"";display:block;width:1px;height:34px;margin:8px auto 0;background:linear-gradient(#fff,transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* =========================================================
   2. COURTYARD — skylight, sun flare, falling flowers, parchment
   ========================================================= */
#court{min-height:118vh;padding-top:44vh;padding-bottom:12vh}
#court .scene{background-position:50% 0}
#court .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(60,20,8,.35) 100%)}
.flare{position:absolute;left:58%;top:10%;width:220px;height:220px;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,255,235,1) 0 6%,rgba(255,220,130,.8) 12%,rgba(255,170,60,.25) 34%,transparent 62%);
  animation:flare 4.5s ease-in-out infinite}
.flare::before,.flare::after{content:"";position:absolute;left:50%;top:50%;width:360px;height:3px;transform:translate(-50%,-50%) rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.9),transparent)}
.flare::after{transform:translate(-50%,-50%) rotate(-62deg);width:260px}
@keyframes flare{50%{opacity:.7;transform:translate(-50%,-50%) scale(1.15)}}
canvas.petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

.parch{position:relative;z-index:2;margin:0 18px;padding:46px 26px 40px;text-align:center;color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(90% 60% at 20% 90%,rgba(184,137,58,.14),transparent 60%),
    var(--paper);
  filter:drop-shadow(0 18px 30px rgba(40,10,0,.45))}
.parch .blessing{font-size:15px;font-style:italic;color:var(--ink-soft);line-height:1.5}
.parch .invites{font-family:var(--script);font-size:38px;color:var(--teal);margin:6px 0 4px}
.parch p{font-size:16px;line-height:1.6;margin:10px 0}
.parch .who{font-weight:600;color:var(--maroon)}
.parch .couple{margin-top:18px}
.parch .couple .caps{font-size:22px;line-height:1.15;letter-spacing:.18em;color:var(--maroon)}
.parch .amp{font-family:var(--script);font-size:34px;color:var(--gold);line-height:1}
.parch .sub{font-size:13px;letter-spacing:.2em;color:var(--ink-soft);margin-top:4px}
.flourish{width:120px;height:20px;margin:14px auto;opacity:.8}

/* =========================================================
   3. SKY + hanging brass lamps
   ========================================================= */
#sky{height:78vh;min-height:520px}
#sky .scene.missing{background:
  radial-gradient(40% 18% at 25% 40%,rgba(255,255,255,.95),transparent 70%),
  radial-gradient(50% 20% at 75% 62%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(35% 14% at 55% 22%,rgba(255,255,255,.85),transparent 70%),
  linear-gradient(180deg,#6fa6d8 0%,#a9cdea 45%,#f6e3c4 100%)}
#sky .scene.missing::after{display:none}
.lamps{position:absolute;inset:0 0 auto 0;height:60%;display:flex;justify-content:space-around;pointer-events:none;z-index:2}
.lamp{width:46px;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
.lamp:nth-child(2){animation-duration:4.8s;animation-delay:-1.2s}
.lamp:nth-child(3){animation-duration:4.3s;animation-delay:-2.1s}
.lamp:nth-child(2) svg{height:62%}
@keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
.lamp svg{width:46px;height:100%;overflow:visible}
#sky .line{position:absolute;left:0;right:0;bottom:30%;text-align:center;z-index:2}
#sky .line .script{font-family:var(--script);font-size:40px;color:var(--maroon-d);text-shadow:0 1px 12px rgba(255,255,255,.9)}
#sky .line .caps{font-size:12px;color:var(--ink);margin-top:4px}
#sky .fade{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,transparent,var(--cream))}

/* =========================================================
   4. COUPLE illustration
   ========================================================= */
#couple{height:100vh;min-height:620px}
#couple .scene{transform:scale(1.08);transition:transform 2.4s cubic-bezier(.2,.7,.2,1)}
#couple.in .scene{transform:scale(1)}
#couple .top{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(180deg,var(--cream),transparent)}
#couple .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 0 30px;text-align:center;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(40,10,4,.75))}
#couple .cap .script{font-family:var(--script);font-size:44px;line-height:1}
#couple .cap .caps{font-size:11px;margin-top:6px;opacity:.9}

/* =========================================================
   5 & 6. ARCH frame (events / location)
   ========================================================= */
.archwrap{position:relative;padding:26px 14px 0;background:var(--maroon)}
.archwrap::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 6px,transparent 6px 12px)}
.arch{position:relative;width:100%}
.arch svg{display:block;width:100%;height:auto}
.arch .inner{position:absolute;left:12%;right:12%;top:24%;bottom:4%;display:flex;flex-direction:column;align-items:center;text-align:center}
.tiles{height:16px;background:
  repeating-linear-gradient(90deg,var(--teal) 0 10px,#e9dcc0 10px 12px,#8b1c1c 12px 22px,#e9dcc0 22px 24px);
  border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.h-script{font-family:var(--script);font-size:46px;color:var(--maroon);line-height:1}
.ev{width:100%;padding:14px 0;border-bottom:1px solid rgba(184,137,58,.35)}
.ev:last-child{border-bottom:0}
.ev .n{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--maroon);font-weight:600}
.ev .d{font-size:18px;margin-top:4px}
.ev .t{font-size:15px;color:var(--ink-soft);font-style:italic}
.count{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.count div{min-width:58px;padding:8px 4px;border:1px solid rgba(184,137,58,.5);border-radius:6px;background:rgba(255,255,255,.4)}
.count b{display:block;font-size:22px;font-weight:600;color:var(--maroon)}
.count span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}

.pin{width:18px;height:18px;margin:8px auto;color:var(--maroon)}
.btn{display:inline-flex;align-items:center;gap:8px;margin:12px 0 4px;padding:11px 22px;border-radius:30px;text-decoration:none;
  background:var(--maroon);color:#f7e2b6;font:600 12px var(--serif);letter-spacing:.2em;text-transform:uppercase;
  box-shadow:0 6px 18px rgba(74,14,14,.35);border:1px solid var(--gold)}
.btn svg{width:14px;height:14px}

/* ---------- mansion base under arches (image masked to fade in) ---------- */
.base{position:relative;height:46vh;min-height:300px;margin-top:-16vh;z-index:1}
.base .scene{-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 38%);mask-image:linear-gradient(180deg,transparent 0%,#000 38%)}
.base .scene.missing{-webkit-mask-image:none;mask-image:none}
.arch,.archwrap>*{position:relative;z-index:2}

/* story */
#story{padding:64px 30px 30px;text-align:center;background:var(--cream)}
#story p{font-size:17px;line-height:1.7;color:var(--ink);margin-top:14px}

.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#court .scene video{object-position:50% 0}
.birds{position:absolute;left:0;right:0;pointer-events:none;z-index:1;overflow:hidden}
#hero .birds{top:31%;height:17%}
#hero .txt{z-index:2}
#sky .birds{top:4%;height:60%}
.bird{position:absolute;left:0;top:0;width:28px;height:14px;opacity:.75;will-change:transform;animation:fly linear infinite}
.bird svg{width:100%;height:100%;overflow:visible;animation:flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
.bird path{fill:none;stroke:#3a2418;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes fly{from{transform:translate(var(--x0),var(--y0)) scale(var(--s))}to{transform:translate(var(--x1),var(--y1)) scale(var(--s))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
.powered{background:#2b0808;color:#c9a978;text-align:center;padding:14px 16px 18px;font:12px/1.6 system-ui,sans-serif;letter-spacing:.02em}
.powered a{color:#f3d58f;text-decoration:none;font-weight:600}
.powered .cta{display:inline-block;margin-top:6px;padding:6px 14px;border:1px solid rgba(243,213,143,.45);border-radius:20px;font-size:11.5px}
footer{background:var(--maroon-d);color:#e9cf98;text-align:center;padding:22px 16px 28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
footer .script{font-family:var(--script);font-size:28px;letter-spacing:0;text-transform:none;color:#f5dfae;display:block;margin-bottom:4px}

/* music toggle */
#music{position:fixed;right:max(14px,calc(50% - 226px));bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);
  background:rgba(74,14,14,.85);color:#f3d58f;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#music.show{display:flex}
#music svg{width:18px;height:18px}
#music.playing svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01s!important}
}
</style>
</head>
<body class="locked">

<!-- 0. DOOR -->
<div id="gate" aria-label="Invitation cover">
  <div class="frame">
    <div class="lintel"></div>
    <div class="glow"></div>
    <div class="leaf l"><div class="panel"></div><div class="panel"></div><div class="panel"></div><div class="panel"></div><span class="knock"></span></div>
    <div class="leaf r"><div class="panel"></div><div class="panel"></div><div class="panel"></div><div class="panel"></div><span class="knock"></span></div>
    <div class="cta"><small id="gateNames"></small><button id="openBtn" type="button">Open Invitation</button></div>
  </div>
</div>

<div id="app">

  <!-- 1. HERO -->
  <section id="hero">
    <div class="scene" data-img="mansion" data-label="images/01-mansion.jpg"></div>
    <div class="veil"></div>
    <div class="txt">
      <div class="caps name rv" id="h1"></div>
      <div class="weds rv d1">weds</div>
      <div class="caps name rv d2" id="h2"></div>
      <div class="date caps rv d3" id="hDate"></div>
    </div>
    <div class="birds"></div>
    <div class="scroll-hint">Scroll</div>
  </section>

  <!-- 2. COURTYARD -->
  <section id="court">
    <div class="scene" data-img="courtyard" data-label="images/02-courtyard.jpg"></div>
    <div class="shade"></div>
    <div class="flare"></div>
    <canvas class="petals"></canvas>
    <div class="parch rv" id="parch">
      <div class="blessing" id="pBless"></div>
      <div class="invites">invites</div>
      <p><span class="who" id="pGrand"></span></p>
      <p><span class="who" id="pParents"></span><br><span id="pLine"></span></p>
      <svg class="flourish" viewBox="0 0 120 20"><path d="M2 10h44M74 10h44" stroke="#b8893a" stroke-width="1"/><path d="M60 3l6 7-6 7-6-7z" fill="none" stroke="#b8893a"/><circle cx="60" cy="10" r="1.6" fill="#b8893a"/></svg>
      <div class="couple">
        <div class="caps" id="pBride"></div>
        <div class="amp">&amp;</div>
        <div class="caps" id="pGroom"></div>
        <div class="sub" id="pDate"></div>
      </div>
    </div>
  </section>

  <!-- 3. SKY + LAMPS -->
  <section id="sky">
    <div class="scene" data-img="sky" data-label="images/03-sky.jpg"></div>
    <div class="lamps" id="lamps"></div>
    <div class="line">
      <div class="script rv" id="skyLine"></div>
      <div class="caps rv d1" id="skySub"></div>
    </div>
    <div class="birds"></div>
    <div class="fade"></div>
  </section>

  <!-- 4. COUPLE -->
  <section id="couple">
    <div class="scene" data-img="couple" data-label="images/04-couple.jpg"></div>
    <div class="top"></div>
    <div class="cap">
      <div class="script rv" id="cNames"></div>
      <div class="caps rv d1" id="cSub"></div>
    </div>
  </section>

  <!-- 5. STORY (optional) -->
  <section id="story">
    <div class="h-script rv" id="sTitle"></div>
    <p class="rv d1" id="sText"></p>
  </section>

  <!-- 6. EVENTS in arch -->
  <section id="events">
    <div class="tiles"></div>
    <div class="archwrap">
      <div class="arch rv">
        <svg viewBox="0 0 400 640" preserveAspectRatio="none" class="archsvg"></svg>
        <div class="inner">
          <div class="h-script">Celebrations</div>
          <div class="count" id="count"></div>
          <div id="evList" style="width:100%"></div>
        </div>
      </div>
    </div>
    <div class="base"><div class="scene" data-img="base" data-label="images/05-mansion-base.jpg"></div></div>
  </section>

  <!-- 7. LOCATION + THANK YOU -->
  <section id="venue">
    <div class="tiles"></div>
    <div class="archwrap">
      <div class="arch rv">
        <svg viewBox="0 0 400 720" preserveAspectRatio="none" class="archsvg"></svg>
        <div class="inner">
          <div class="h-script">Wedding</div>
          <div class="caps" style="font-size:13px;margin-top:10px">Location</div>
          <svg class="pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
          <div style="font-size:19px;font-weight:600;color:var(--maroon)" id="vName"></div>
          <div style="font-size:15px;color:var(--ink-soft);margin-top:2px" id="vAddr"></div>
          <a class="btn" id="vMap" target="_blank" rel="noopener">

</div>

<button id="music" type="button" aria-label="Music on or off">

</button>
<audio id="bgm" loop preload="none"></audio>

<script>
/* =========================================================

   ========================================================= */
const CONFIG = {

  "groomFull": "Arjun Ramanathan",
  "brideFull": "Meenakshi Subramanian",
  "dateLong": "Friday, 12 February 2027",
  "dateShort": "12 · 02 · 2027",
  "weddingAt": "2027-02-12T07:30:00+05:30",
  "blessing": "With the blessings of the Almighty and our beloved elders",
  "grandparents": "Late Sri. A. Ramanathan & Smt. R. Valliammai",
  "parents": "Mr. R. Subramanian & Mrs. S. Lakshmi",
  "inviteLine": "cordially invite you to grace the auspicious wedding ceremony of their beloved daughter",
  "skyLine": "Two hearts, one home",
  "skySub": "Rooted in tradition",
  "coupleSub": "Together, with the blessings of our families",
  "storyTitle": "Our Story",
  "story": "Two families from the same old streets of Karaikudi, one chance meeting at a cousin's wedding, and a hundred evenings of long phone calls later — we are ready to begin our forever. We would be honoured to have you with us.",
  "events": [
    {
      "name": "Nichayathartham",
      "date": "Thursday, 11 February 2027",

    },

  },

    "mansion": "",
    "courtyard": "",
    "sky": "",
    "couple": "",
    "base": "",
    "footer": ""
  },

    "mansion": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/vid-mansion-1790014785671.mp4",
    "courtyard": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/vid-courtyard-1790014786002.mp4",
    "couple": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/vid-couple-1790014786240.mp4",
    "base": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/vid-base-1790014786548.mp4",
    "footer": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/vid-footer-1790014787121.mp4"

  "music": "https://pub-1d2f18ed0a8d407dad41cfb99c7b3963.r2.dev/testp/music-1790014853985.mp3",
  "petals": true,
  "birds": true,

    "whatsapp": "918971738710"
  }
};

/* =========================================================
   Engine — no need to edit below
   ========================================================= */
const $ = s => document.querySelector(s);
const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

// text
set('gateNames', `${CONFIG.bride} & ${CONFIG.groom}`);
set('h1', CONFIG.groom); set('h2', CONFIG.bride); set('hDate', CONFIG.dateShort);
set('pBless', CONFIG.blessing); set('pGrand', CONFIG.grandparents);
set('pParents', CONFIG.parents); set('pLine', CONFIG.inviteLine);
set('pBride', CONFIG.brideFull); set('pGroom', CONFIG.groomFull); set('pDate', CONFIG.dateLong);
set('skyLine', CONFIG.skyLine); set('skySub', CONFIG.skySub);
set('cNames', `${CONFIG.bride} & ${CONFIG.groom}`); set('cSub', CONFIG.coupleSub);
set('sTitle', CONFIG.storyTitle); set('sText', CONFIG.story);
if (!CONFIG.storyTitle) $('#story').remove();
set('vName', CONFIG.venue.name); set('vAddr', CONFIG.venue.address);
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '#';
$('#vMap').href = safeUrl(CONFIG.venue.map);
set('tyLine', CONFIG.thankYouLine); set('tyFrom', CONFIG.from);
set('fNames', `${CONFIG.bride} & ${CONFIG.groom}`); set('fDate', CONFIG.dateShort);
document.title = `${CONFIG.bride} & ${CONFIG.groom} — Wedding Invitation`;

const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#evList').innerHTML = CONFIG.events.map(e =>
  `<div class="ev"><div class="n">${esc(e.name)}</div><div class="d">${esc(e.date)}</div><div class="t">${esc(e.time)}</div></div>`).join('');

// images with placeholder fallback
const vio = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target; if (e.isIntersecting) v.play().catch(()=>{}); else v.pause();
}), { threshold: .05 });
document.querySelectorAll('.scene[data-img]').forEach(el => {
  const key = el.dataset.img;
  const src = CONFIG.images[key], vsrc = (CONFIG.videos || {})[key];
  if (vsrc){
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    if (src) v.poster = src;
    v.src = vsrc;
    el.appendChild(v); vio.observe(v);
    if (el.parentElement && el.parentElement.id === 'hero') el.style.animation = 'none';
    return;
  }
  if (!src) { el.classList.add('missing'); return; }
  const im = new Image();
  im.onload  = () => { el.style.backgroundImage = `url("${src}")`; };
  im.onerror = () => el.classList.add('missing');
  im.src = src;
});

// birds flying across the sky
if (CONFIG.birds !== false && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const birdSVG = '<svg viewBox="0 0 28 14"><path d="M1 7 Q7 1 14 8 Q21 1 27 7"/></svg>';
  document.querySelectorAll('.birds').forEach((box, bi) => {
    const n = bi === 0 ? 5 : 7;
    for (let i = 0; i < n; i++){
      const b = document.createElement('div'); b.className = 'bird'; b.innerHTML = birdSVG;
      const ltr = Math.random() < .7, y = 8 + Math.random() * 70, dy = -10 + Math.random() * 20;
      const s = .45 + Math.random() * .6, dur = 14 + Math.random() * 12;
      b.style.setProperty('--x0', ltr ? '-40px' : '520px'); b.style.setProperty('--x1', ltr ? '520px' : '-40px');
      b.style.setProperty('--y0', '0px'); b.style.setProperty('--y1', (dy * 3) + 'px');
      b.style.setProperty('--s', (ltr ? s : -s) + ',' + s);
      b.style.top = y + '%';
      b.style.animationDuration = dur + 's'; b.style.animationDelay = (-Math.random() * dur) + 's';
      b.firstChild.style.animationDuration = (.35 + Math.random() * .3) + 's';
      box.appendChild(b);
    }
  });
}

// powered by + enquiry button
(function(){
  const pb = CONFIG.poweredBy; const el = $('#powered');
  if (!pb || !pb.text){ el.remove(); return; }
  const wa = pb.whatsapp ? `<br><a class="cta" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(String(pb.whatsapp).replace(/\D/g, ''))}?text=${encodeURIComponent('Hi, I saw a wedding invite made by you and I want one like this')}">Want an invite like this? Chat on WhatsApp</a>` : '';
  el.innerHTML = `Powered by <a target="_blank" rel="noopener" href="${esc(safeUrl(pb.url))}">${esc(pb.text)}</a>${wa}`;
})();

// cusped Chettinad arch (multifoil opening inside a maroon frame)
function archPath(W, H){
  const L = 34, R = W - 34, spring = H * 0.30, peak = H * 0.05, cx = W / 2;
  const n = 7, pts = [];
  for (let i = 0; i <= n; i++){
    const t = (i / n) * Math.PI / 2;
    pts.push([L + (cx - L) * (1 - Math.cos(t)), spring - (spring - peak) * Math.sin(t)]);
  }
  const right = pts.slice(0, -1).reverse().map(([x, y]) => [W - x, y]);
  const all = pts.concat(right);
  let d = `M${L} ${H} L${L} ${spring}`;
  for (let i = 1; i < all.length; i++){
    const [x0, y0] = all[i - 1], [x1, y1] = all[i];
    const r = Math.hypot(x1 - x0, y1 - y0) * 0.62;
    d += ` A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  return d + ` L${R} ${H} Z`;
}
document.querySelectorAll('.archsvg').forEach(svg => {
  const [,, W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
  const d = archPath(W, H);
  svg.innerHTML = `
    <defs>
      <radialGradient id="pg${H}" cx="50%" cy="20%" r="80%">
        <stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#f6ecd9"/><stop offset="1" stop-color="#ecdcbc"/>
      </radialGradient>
    </defs>
    <path d="${d}" fill="#3e0b0b" transform="translate(0 6)" opacity=".5"/>
    <path d="${d}" fill="url(#pg${H})"/>
    <path d="${d}" fill="none" stroke="#b8893a" stroke-width="3"/>
    <path d="${d}" fill="none" stroke="#e2bf73" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" transform="translate(${W*0.02} ${H*0.012}) scale(.96 .985)"/>`;
});

// torn paper edge on the parchment card
(function(){
  const pts = [], n = 26, j = () => (Math.random() * 1.4).toFixed(2);
  for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(2)}% ${j()}%`);
  for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(2)}% ${(100 - j()).toFixed(2)}%`);
  $('#parch').style.clipPath = `polygon(${pts.join(',')})`;
})();

// hanging brass lamps
const lampSVG = `<svg viewBox="0 0 46 300" preserveAspectRatio="xMidYMin meet">
  <line x1="23" y1="0" x2="23" y2="230" stroke="#8a6424" stroke-width="1.6"/>
  <g transform="translate(0 222)">
    <ellipse cx="23" cy="6" rx="8" ry="4" fill="#c9a257"/>
    <path d="M9 10 Q23 0 37 10 L33 32 Q23 42 13 32 Z" fill="#b8893a" stroke="#7a5316"/>
    <path d="M13 32 Q23 40 33 32 L30 44 Q23 50 16 44 Z" fill="#e2bf73"/>
    <circle cx="23" cy="52" r="3" fill="#c9a257"/>
    <path d="M20 54 Q23 64 26 54" fill="#ffb347"/>
    <circle cx="23" cy="60" r="10" fill="rgba(255,200,90,.35)"/>
  </g></svg>`;
$('#lamps').innerHTML = `<div class="lamp">${lampSVG}</div><div class="lamp">${lampSVG}</div><div class="lamp">${lampSVG}</div>`;

// scroll reveal
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .18 });
document.querySelectorAll('.rv, #couple').forEach(el => io.observe(el));

// countdown
function tick(){
  const ms = new Date(CONFIG.weddingAt) - Date.now();
  const el = $('#count');
  if (isNaN(ms)) { el.remove(); return; }
  if (ms <= 0){ el.innerHTML = `<div style="padding:8px 14px"><b style="font-size:18px">Today is the day</b></div>`; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  el.innerHTML = [[d,'Days'],[h,'Hrs'],[m,'Min'],[s,'Sec']].map(([v,l]) => `<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

// falling flowers over the courtyard
(function(){
  if (!CONFIG.petals || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#court canvas.petals'), ctx = cv.getContext('2d');
  const colors = ['#f59e0b','#fbbf24','#dc2626','#b91c1c','#fff7e6','#f97316'];
  let W, H, dpr, running = false, P = [];
  function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function make(fromTop){
    return { x: Math.random() * W, y: fromTop ? -20 : Math.random() * H * .5, r: 4 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)], vy: .5 + Math.random() * 1.1, vx: -.3 + Math.random() * .6,
      a: Math.random() * 6.28, va: -.04 + Math.random() * .08, sway: Math.random() * 6.28, kind: Math.random() < .35 ? 'mari' : 'petal' };
  }
  function draw(p){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
    if (p.kind === 'mari'){                       // small marigold: ring of dots
      for (let i = 0; i < 8; i++){ ctx.beginPath(); ctx.arc(Math.cos(i*.785)*p.r*.6, Math.sin(i*.785)*p.r*.6, p.r*.45, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(0,0,p.r*.35,0,6.28); ctx.fill();
    } else {                                      // rose / jasmine petal
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(-p.r*.2, -p.r*.1, p.r*.45, p.r*.2, 0, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }
  function frame(){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of P){
      p.sway += .02; p.x += p.vx + Math.sin(p.sway) * .5; p.y += p.vy; p.a += p.va;
      if (p.y > H + 20) Object.assign(p, make(true));
      draw(p);
    }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size);
  P = Array.from({ length: 34 }, () => make(false));
  new IntersectionObserver(es => es.forEach(e => {
    const was = running; running = e.isIntersecting;
    if (running && !was) requestAnimationFrame(frame);
  })).observe($('#court'));
})();

// music
const bgm = $('#bgm'), mBtn = $('#music');
if (CONFIG.music){ bgm.src = CONFIG.music; bgm.onerror = () => { CONFIG.music = ''; mBtn.classList.remove('show'); }; }
mBtn.onclick = () => {
  if (bgm.paused){ bgm.play().then(() => mBtn.classList.add('playing')).catch(()=>{}); }
  else { bgm.pause(); mBtn.classList.remove('playing'); }
};

// open the door
$('#openBtn').onclick = () => {
  const gate = $('#gate');
  gate.classList.add('open');
  document.body.classList.remove('locked');
  if (CONFIG.music){
    mBtn.classList.add('show');
    bgm.play().then(() => mBtn.classList.add('playing')).catch(()=>{});
  }
  setTimeout(() => gate.classList.add('gone'), 2600);
};

// builder preview support: skip the door, jump to a section
if (CONFIG.skipGate){ $('#gate').classList.add('gone'); document.body.classList.remove('locked');
  document.querySelectorAll('.rv, #couple').forEach(el => el.classList.add('in')); }
addEventListener('message', e => {
  const id = e.data && e.data.goto; if (!id) return;
  const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: e.data.instant ? 'auto' : 'smooth' });
});
</script>
