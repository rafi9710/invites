<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baddela’s Wedding Invitation</title>
<meta name="theme-color" content="#3d0710">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Noto+Serif+Telugu:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TEMPLE GOPURAM — scroll-scrubbed web invitation (AfterFX Invite Studio layout 5)
   One phone-width column; each "scene" = tall section + sticky 100svh stage
   whose layers are moved by scroll progress (own engine, no libraries).
   ========================================================= */
:root{
  --cream:#fff4de; --wall:#f1dfbd;
  --ink:#4a2316; --ink-soft:#7a4a32;
  --gold:#c39236; --gold-2:#f0c865; --gold-3:#8a6020;
  --maroon:#5a0b18; --maroon-2:#7a1527; --maroon-3:#3d0710;
  --vermilion:#d8432c; --teal:#2b7fa8; --wa:#1f9d55;
  --f-names:'Marcellus','Cormorant Garamond',Georgia,serif;
  --f-script:'Pinyon Script','Snell Roundhand',cursive;
  --f-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-te:'Noto Serif Telugu','Gautami','Nirmala UI',serif;
  --col:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--maroon-3)}
body{background:radial-gradient(120% 60% at 50% 0%,var(--maroon-2) 0%,var(--maroon-3) 70%) fixed,var(--maroon-3);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
#app{position:relative;max-width:var(--col);margin:0 auto;background:var(--cream);overflow:clip;box-shadow:0 0 80px rgba(0,0,0,.45)}
img{display:block;max-width:100%}
a{color:inherit}
.scene{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.layer{position:absolute;will-change:transform}
.layer img{width:100%;height:auto}
.flip img,img.flip{transform:scaleX(-1)}
.script{font-family:var(--f-script),var(--f-body);font-weight:400;line-height:1.05}
.caps{font-family:var(--f-names);letter-spacing:.08em;text-transform:uppercase}
.te{font-family:var(--f-te),var(--f-body)}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--f-names);font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:0;border-radius:999px;padding:12px 22px}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-gold{background:linear-gradient(180deg,#f7d87e,#d3a03e);color:var(--maroon-3);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-maroon{background:var(--maroon);color:var(--gold-2);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.rule{width:70%;height:10px;background:radial-gradient(circle,var(--gold) 0 3px,transparent 3.5px) center/14px 10px no-repeat,linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat}
.missing{background:linear-gradient(160deg,#f6e3bf,#e2bf82)}

/* ---------- doors ---------- */
#gate{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:var(--maroon-3);transition:opacity .7s ease .9s}
#gate .wrap{position:relative;width:100%;max-width:var(--col);height:100%;perspective:1400px;overflow:hidden;background:#1a0306}
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:#5a1c0a;transition:transform 1.5s cubic-bezier(.65,0,.35,1) .3s;backface-visibility:hidden}
.door .img{position:absolute;inset:0;background-position:right center;background-size:auto 100%;background-repeat:no-repeat}
.door.r .img{transform:scaleX(-1)}
.door.l{left:0;transform-origin:0 50%}.door.r{right:0;transform-origin:100% 50%}
.door.l::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.6))}
.gcopy{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-56%);width:min(84%,340px);text-align:center;color:var(--cream);transition:opacity .45s,transform .45s;
  padding:28px 20px 26px;background:radial-gradient(120% 100% at 50% 0%,rgba(90,11,24,.94),rgba(45,6,12,.94));border:1px solid rgba(240,200,101,.55);border-radius:180px 180px 14px 14px;
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 5px rgba(90,11,24,.9),inset 0 0 0 6px rgba(240,200,101,.35)}
.gcopy .tl{font-size:14px;color:var(--gold-2);letter-spacing:.03em}
.gcopy .script{font-size:38px;color:var(--gold-2);margin:10px 0 6px}
.gcopy .caps{font-size:24px;line-height:1.2;color:#fff}
.gcopy .amp{display:block;font-family:var(--f-script),var(--f-body);font-size:26px;color:var(--gold-2);line-height:1.1;text-transform:none;letter-spacing:0}
.gcopy .date{font-size:15px;margin-top:10px;letter-spacing:.06em;color:#f3dcc0}
.gcopy .btn{margin-top:20px}
#gate.open .door.l{transform:rotateY(-108deg)}#gate.open .door.r{transform:rotateY(108deg)}
#gate.open .gcopy{opacity:0;transform:translate(-50%,-62%)}
#gate.open{opacity:0;pointer-events:none}#gate.gone{display:none}

/* ---------- 1 · hero ---------- */
#hero{height:330vh}
#hero .sky{position:absolute;inset:0;background:linear-gradient(180deg,#1c66cf,#4c9fea 48%,#a6d8f8);background-size:cover;background-position:center bottom}
#hero .sky::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(14,60,140,.35),transparent)}
.h-names{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(10,40,100,.4);padding-inline:16px}
.h-names .tl{font-size:13px;letter-spacing:.05em;opacity:.95;margin-bottom:4px}
.h-names .fam{font-family:var(--f-script),var(--f-body);font-size:clamp(24px,7.5vw,32px);line-height:1.2;margin:2px 0 8px}
.h-names .caps{font-size:clamp(34px,10.5vw,50px);line-height:1.05;letter-spacing:.06em;white-space:nowrap}
.h-names .weds{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px;font-family:var(--f-script),var(--f-body);font-size:28px}
.h-names .weds::before,.h-names .weds::after{content:"";width:46px;height:1px;background:rgba(255,255,255,.75)}
.h-gopuram{left:50%;bottom:0;width:92%;transform-origin:50% 90%;transform:translate(-50%,60%);filter:drop-shadow(0 -6px 30px rgba(255,240,200,.35))}
.h-tree{bottom:-3%;width:66%}.h-tree.l{left:-12%}.h-tree.r{right:-12%}
.h-hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-family:var(--f-names);font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.4);z-index:5}
.h-hint i{display:block;width:12px;height:12px;margin:8px auto 0;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px) rotate(45deg)}}
.h-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fffaf0,#f7e6c6);opacity:0;pointer-events:none;z-index:6}

/* ---------- 2 · invite card ---------- */
#invite .wall{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#fbefd6,var(--wall) 75%)}
.pillar{position:absolute;top:0;bottom:0;width:18%;background-position:center top;background-size:100% auto;background-repeat:repeat-y;filter:drop-shadow(0 6px 12px rgba(90,40,10,.3))}
.pillar.l{left:0}.pillar.r{right:0}
.toran{top:0;left:0;right:0;z-index:3}
.arch-win{position:absolute;left:19%;right:19%;bottom:0;display:flex;flex-direction:column;filter:drop-shadow(0 10px 24px rgba(120,70,20,.22))}
#invite .arch-win{top:13%}
.arch-top{display:block;width:100%;height:auto;margin-bottom:-1px}
.arch-body{flex:1;background:var(--cream);box-shadow:inset 2px 0 0 var(--gold),inset -2px 0 0 var(--gold)}
.inv-copy{position:absolute;left:0;right:0;top:5%;bottom:3%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding-inline:12px;color:var(--ink)}
.inv-copy .sym{width:60px;height:auto}.inv-copy .sym.sm{width:44px}.inv-copy .sym.lg{width:84px}
.inv-copy p{font-size:14.5px;line-height:1.35;color:var(--ink-soft);text-wrap:balance}
.inv-copy .grand{font-size:13px;font-style:italic}
.inv-copy .parents{font-size:15.5px;color:var(--maroon);font-weight:600}
.inv-copy .names{font-family:var(--f-names);font-size:clamp(20px,6.2vw,27px);letter-spacing:.06em;color:#b8822c;line-height:1.15;text-wrap:balance}
.inv-copy .names .par{display:block;font-family:var(--f-body);font-size:13px;letter-spacing:.02em;color:var(--ink-soft);line-height:1.3;margin-top:3px;text-wrap:balance}
.inv-copy .names .par:empty{display:none}
.inv-copy .names .amp{display:block;font-family:var(--f-script),var(--f-body);font-size:28px;color:var(--vermilion);letter-spacing:0;margin:2px 0}
.inv-copy .when{font-family:var(--f-names);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon)}

/* ---------- 3 · events ---------- */
#events{position:relative;background:var(--cream)}
.lotus-band{width:100%;height:auto;padding:14px 0 4px}
.ev-head{text-align:center;padding:6px 20px 8px}
.ev-head .script{font-size:42px;color:var(--teal)}
.ev-list{display:grid;gap:18px;padding:18px 20px 34px}
.ev{background:#fffaf0;border:1px solid rgba(195,146,54,.55);border-radius:16px;overflow:hidden;box-shadow:0 10px 26px rgba(120,70,20,.12)}
.ev-art{position:relative;aspect-ratio:16/8;background:linear-gradient(135deg,var(--maroon-2),var(--maroon)) center/cover no-repeat}
.ev-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(40,8,4,.72))}
.ev-art .n{position:absolute;left:16px;right:16px;bottom:10px;z-index:1;font-family:var(--f-names);font-size:21px;letter-spacing:.04em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.ev-body{padding:14px 18px 18px;display:grid;gap:4px}
.ev-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:16px;color:var(--ink-soft)}
.ev-meta b{font-family:var(--f-names);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-3);padding-top:4px}
.ev-when{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.ev-when .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--chip-bg,var(--maroon));color:var(--chip-fg,var(--gold-2));font-family:var(--f-ev,var(--f-names));font-size:15.5px;letter-spacing:.03em;line-height:1.2;box-shadow:0 3px 10px rgba(90,11,24,.22)}
.ev-when .chip svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.chip-plain .ev-when .chip{background:none;box-shadow:none;padding:0;color:var(--ink);font-size:17px}
.ev-body .btn{justify-self:start;margin-top:10px;padding:10px 18px;font-size:12px}
.cloud-edge{display:block;width:100%;height:auto;margin-bottom:-2px}

/* ---------- 4 · storybook ---------- */
#story{height:420vh;background:#bfe6fb}
.world{position:absolute;left:0;right:0;top:0;height:200%;will-change:transform}
.w-sky{position:absolute;left:0;right:0;top:0;height:47%;background:linear-gradient(180deg,#7cc4f2 0%,#b7e2fb 60%,#e3f4fd 100%)}
.w-floor{position:absolute;left:0;right:0;top:44%;bottom:0;background:#e8c68d center top/cover no-repeat}
.w-floor::before{content:"";position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(180deg,#e3f4fd,rgba(227,244,253,0))}
.st-cap{position:absolute;left:0;right:0;top:12%;z-index:8;text-align:center;padding-inline:20px;color:var(--maroon);pointer-events:none;opacity:0}
.st-cap .pnl{display:inline-block;max-width:100%;padding:12px 26px 14px;border-radius:120px 120px 18px 18px;background:rgba(255,244,222,.92);border:1px solid rgba(195,146,54,.6);box-shadow:0 10px 30px rgba(90,40,10,.18)}
.st-cap .script{font-size:38px}
.st-cap p{margin-top:6px;font-family:var(--f-names);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
.st-cap.two{top:auto;bottom:7%}
.petal{position:absolute;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;opacity:.9;z-index:7;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(40px,115vh) rotate(540deg)}}

/* ---------- 5 · meet the couple ---------- */
.maroon{position:relative;color:var(--cream);background:
  radial-gradient(circle at 25% 20%,rgba(240,200,101,.07) 0 30px,transparent 31px) 0 0/90px 90px,
  radial-gradient(circle at 75% 70%,rgba(240,200,101,.06) 0 18px,transparent 19px) 0 0/90px 90px,
  linear-gradient(180deg,var(--maroon-2),var(--maroon))}
#couple{padding:40px 0 0;overflow:hidden}
.mt-head{text-align:center;color:var(--gold-2);position:relative;z-index:2;padding-inline:58px;font-size:40px;text-wrap:balance}
.lantern{position:absolute;top:0;width:54px;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite;z-index:1}
.lantern img{width:100%;height:auto}
.lantern.l{left:12px}.lantern.r{right:12px;animation-delay:-2.2s}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.m-arch{position:relative;margin:26px 22px 0;display:flex;flex-direction:column}
.m-arch .arch-body{padding:6px 22px 30px;color:var(--ink);text-align:center}
.m-arch .story{max-width:34ch;margin:0 auto;font-size:16.5px;line-height:1.45;color:var(--ink-soft)}
.gframe{position:relative;width:76%;margin:22px auto 0;padding:12px;background:linear-gradient(135deg,#f9dc84,#b98327 40%,#f6d57a 60%,#a8741f);border-radius:6px;box-shadow:0 14px 30px rgba(60,20,0,.35)}
.gframe .ph{border:3px solid #7a5216;aspect-ratio:4/5;background:#e9d3a8 center/cover no-repeat}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.duo div{min-width:0}
.duo .caps{font-size:17px;color:var(--maroon);white-space:nowrap}
.fl{margin-top:24px;padding-top:18px;border-top:1px solid rgba(195,146,54,.5)}
.fl-head{font-size:32px;color:var(--maroon);margin-bottom:14px;line-height:1.1}
.fl-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center}
.fl-cols.one{grid-template-columns:1fr}
.fl-col{min-width:0}
.fl-col h4{font-family:var(--f-names);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed rgba(195,146,54,.55)}
.fl-p{margin-bottom:9px;line-height:1.25}
.fl-p small{display:block;font-size:12px;letter-spacing:.04em;color:var(--ink-soft)}
.fl-p span{display:block;font-size:16px;color:var(--maroon);overflow-wrap:anywhere}
.m-sub{margin-top:12px;font-style:italic;color:var(--ink-soft);font-size:15px}

/* ---------- 6 · venue ---------- */
#venue{padding:36px 0 0;text-align:center;overflow:hidden}
#venue .script{font-size:46px;color:var(--gold-2)}
.v-name{font-family:var(--f-names);font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding-inline:24px;margin-top:8px;text-wrap:balance}
.v-addr{color:#f0d6b8;font-size:16px;margin-top:4px;padding-inline:24px}
#venue .btn{margin-top:18px}
.venue-gold{width:100%;height:auto;margin-top:26px;mix-blend-mode:screen}

/* ---------- 7 · rsvp behind curtains ---------- */
#rsvp{height:240vh}
#rsvp .stage{background:linear-gradient(180deg,var(--maroon),var(--maroon-3))}
#rsvp .arch-win{top:12%;left:7%;right:7%;bottom:5%}
.bells{position:absolute;top:22px;left:0;right:0;display:flex;justify-content:space-around;z-index:4;padding-inline:8%}
.bells svg{width:22px;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite}
.bells svg:nth-child(even){animation-delay:-1.6s}
.rs-copy{position:absolute;left:7%;right:7%;top:12%;bottom:5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:60px 22px 18px;color:var(--ink);overflow:auto}
.rs-copy .script{font-size:clamp(40px,12vw,52px);color:var(--maroon)}
.rs-copy p{max-width:30ch;font-size:16px;color:var(--ink-soft)}
.rcard{width:100%}
.rnote{font-size:14px;color:var(--ink-soft)}
#rForm{display:flex;flex-direction:column;gap:9px;margin-top:6px;text-align:left}
#rForm input,#rForm textarea,#rForm select{width:100%;font:16px var(--f-body);color:var(--ink);padding:10px 12px;border:1px solid rgba(195,146,54,.6);border-radius:8px;background:#fffdf8}
#rForm textarea{resize:vertical}
.rchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rchoice button{font:600 14px var(--f-body);padding:10px 6px;border-radius:8px;border:1px solid rgba(195,146,54,.6);background:#fffdf8;color:var(--ink);cursor:pointer}
.rchoice button.on{background:var(--maroon);color:#f7e2b6;border-color:var(--maroon)}
.rguests{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink-soft)}
.rguests select{width:90px!important}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
#rForm .btn{align-self:center;margin-top:4px}
.rmsg{min-height:18px;font-size:14px;text-align:center;color:#a0281e}
.rdone{display:none;font-size:18px;color:var(--maroon);padding:14px 6px 6px;line-height:1.5}
.rcard.sent #rForm{display:none}.rcard.sent .rdone{display:block}
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:5;display:flex;flex-direction:column;filter:drop-shadow(0 0 16px rgba(0,0,0,.55));will-change:transform}
.curtain .body{flex:1;background-repeat:no-repeat;background-size:245.45% 149.33%;background-color:#6a0f1d}
.curtain .fr{aspect-ratio:440/114;background-repeat:no-repeat;background-size:245.45% 586.8%}
.curtain.l{left:0}.curtain.r{right:0}
.curtain.l .body{background-position:15.6% 50.7%}.curtain.r .body{background-position:84.4% 50.7%}
.curtain.l .fr{background-position:15.6% 100%}.curtain.r .fr{background-position:84.4% 100%}
.valance{position:absolute;left:0;right:0;top:0;z-index:6;aspect-ratio:1080/112;background-repeat:no-repeat;background-size:100% 597.3%;background-position:0 0}
.curtain.plain .body{background:repeating-linear-gradient(90deg,#6a0f1d 0 10px,#8d1b2e 18px,#6a0f1d 28px,#4c0914 34px)}
.curtain.plain .fr{background:repeating-linear-gradient(90deg,var(--gold-2) 0 3px,transparent 3px 7px);aspect-ratio:auto;height:16px}

/* ---------- 8 · countdown + 9 · moments ---------- */
.paper{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fdf3e1,#f3e2c4 90%)}
.paper .emb{position:absolute;pointer-events:none;opacity:.9;filter:drop-shadow(1.5px 1.5px 0 rgba(255,255,255,.9)) drop-shadow(-1px -1px 0 rgba(150,105,50,.18))}
#count{padding:56px 20px 34px;text-align:center}
#count .script{position:relative;font-size:44px;color:var(--maroon)}
.cd{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:340px;margin:22px auto 0}
.cd div{background:rgba(255,255,255,.75);border:1px solid rgba(195,146,54,.45);border-radius:12px;padding:12px 4px 8px;box-shadow:0 6px 14px rgba(120,70,20,.1)}
.cd b{display:block;font-family:var(--f-names);font-weight:400;font-size:27px;color:var(--maroon);font-variant-numeric:tabular-nums}
.cd span{font-size:11px;font-family:var(--f-names);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-3)}
.cd-date{position:relative;margin-top:16px;color:var(--ink-soft);font-size:16px}
#calBtn{position:relative;margin-top:16px}
#magic{height:78vh;height:78svh;min-height:520px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mg-hint{position:absolute;left:0;right:0;top:8%;text-align:center;z-index:3;pointer-events:none;padding-inline:20px;transition:opacity .4s}
.mg-hint .script{font-size:42px;color:var(--maroon)}
.mg-hint small{display:block;font-size:15px;color:var(--ink-soft);margin-top:4px}
