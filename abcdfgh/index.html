<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited</title>
<meta property="og:title" content="You are invited">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<!-- BLANK CANVAS layout: every section and element comes from CONFIG.design (made in the Designer) -->
<style>
html,body{margin:0;padding:0}
body{background:#f2f2f2;-webkit-text-size-adjust:100%;overflow-x:hidden}
#pg{margin:0 auto;position:relative}
.sw{position:relative;overflow:hidden}
.sec{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.sec .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.afx-el.link{cursor:pointer}
#mus{position:fixed;right:14px;bottom:14px;z-index:50;width:44px;height:44px;border-radius:50%;border:0;display:none;
  background:rgba(20,20,20,.72);color:#fff;font-size:20px;line-height:44px;text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mus.show{display:block}#mus.off{opacity:.55}
#pw{text-align:center;font:12px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#777;padding:18px 12px 26px}
#pw a{color:#8a6a2b;text-decoration:none;font-weight:600}
#pw img{height:18px;vertical-align:-4px;margin-right:6px}
</style>
</head>

<div id="pg"></div>
<div id="pw"></div>
<button id="mus" type="button" aria-label="Music on or off">&#9835;</button>
<audio id="bgm" loop preload="none"></audio>
