<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited</title>
<meta property="og:title" content="You are invited">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a0d0a">
<!-- BLANK CANVAS layout: every section and element comes from CONFIG.design (made in the Designer) -->
<style>
html,body{margin:0;padding:0}
html{overflow-x:hidden}
body{background:#f2f2f2;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden;height:100%}
#pg{margin:0 auto;position:relative}
.sw{position:relative;overflow:hidden;transform-origin:50% 40%;will-change:transform}
.sw.m-stack{position:-webkit-sticky;position:sticky}
.sw.m-stack+.sw{box-shadow:0 -14px 30px rgba(0,0,0,.28)}
.sw .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
.sec{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.sec .bg{position:absolute;left:0;right:0;top:0;bottom:0;background-size:cover;background-position:center;will-change:transform}
.m-parallax .sec .bg{top:-14%;bottom:-14%}
.afx-el.link{cursor:pointer}
/* opening cover */
#gate{position:fixed;inset:0;z-index:100;perspective:1800px;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
#gate .door{position:absolute;top:0;bottom:0;width:50.2%;overflow:hidden;backface-visibility:hidden;
  transition:transform 1.7s cubic-bezier(.62,.04,.22,1),filter 1.7s ease}
#gate .door.l{left:0;transform-origin:0 50%}
#gate .door.r{right:0;transform-origin:100% 50%}
#gate .dimg{position:absolute;top:0;bottom:0;width:199.2%;background-size:cover;background-position:center}
#gate .door.l .dimg{left:0}
#gate .door.r .dimg{right:0}
#gate .door:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(0,0,0,.35))}
#gate .door.l:after,#gate .door.r:after{content:"";position:absolute;top:0;bottom:0;width:3px;z-index:2;background:linear-gradient(180deg,#f3d99a,#b8893a 50%,#f3d99a)}
#gate .door.l:after{right:0}
#gate .door.r:after{left:0}
#gate.fade .door.r{display:none}
#gate.fade .door.l{width:100%}
#gate.fade .door.l .dimg{width:100%}
#gate.fade .door.l:after{display:none}
#gate .seal{position:absolute;left:50%;top:50%;z-index:5;width:176px;height:176px;margin:-88px 0 0 -88px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 38%,rgba(255,252,244,.97),rgba(247,236,214,.95));
  box-shadow:0 0 0 3px #d9b56c,0 0 0 8px rgba(255,250,238,.85),0 0 0 9.5px #b8893a,0 18px 50px rgba(0,0,0,.45);
  animation:breathe 3.2s ease-in-out infinite;transition:transform 1s ease,opacity .8s ease}
#gate .mono{font-size:40px;line-height:1.05;padding:0 14px;max-width:160px;overflow-wrap:break-word}
#gate .gsub{margin-top:8px;font:600 9.5px/1.3 "DM Sans",-apple-system,sans-serif;letter-spacing:.28em;text-transform:uppercase;opacity:.75;padding:0 18px}
#gate .ring{position:absolute;left:50%;top:50%;z-index:4;width:176px;height:176px;margin:-88px 0 0 -88px;border-radius:50%;border:2px solid rgba(243,217,154,.9);animation:ring 2.4s ease-out infinite}
#gate .ring.b{animation-delay:1.2s}
#gate.open{pointer-events:none}
#gate.open .door.l{transform:rotateY(-108deg);filter:brightness(.55)}
#gate.open .door.r{transform:rotateY(108deg);filter:brightness(.55)}
#gate.fade.open .door.l{transform:scale(1.12);opacity:0;transition:transform 1.5s ease,opacity 1.3s ease .2s}
#gate.open .seal{transform:scale(1.35);opacity:0;animation:none}
#gate.open .ring{display:none}
#gate.gone{display:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
/* falling petals + scroll hint */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#hint{position:fixed;left:50%;bottom:22px;z-index:61;width:34px;height:34px;margin-left:-17px;border-radius:50%;display:none;align-items:center;justify-content:center;
  background:rgba(20,10,5,.45);color:#fff;font:20px/1 sans-serif;animation:bob 1.6s ease-in-out infinite;pointer-events:none;transition:opacity .5s}
#hint.show{display:flex}
#hint.off{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
#mus{position:fixed;right:14px;bottom:14px;z-index:62;width:44px;height:44px;border-radius:50%;border:0;display:none;
  background:rgba(20,10,5,.62);color:#fff;font-size:20px;line-height:44px;text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mus.show{display:block}
#mus.off{opacity:.55}
#mus.on{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pw{position:relative;z-index:50;text-align:center;font:12px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#777;padding:18px 12px 26px;background:inherit}
#pw a{color:#8a6a2b;text-decoration:none;font-weight:600}
#pw img{height:18px;vertical-align:-4px;margin-right:6px}
@media (prefers-reduced-motion:reduce){#gate .seal,#gate .ring,#hint,#mus.on{animation:none}}
</style>
</head>

  /* ---------------- running animations (Web Animations API) ---------------- */
