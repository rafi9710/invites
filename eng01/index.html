<style>
:root{
  --w:min(100vw,480px);
  --ink:#3f2b33; --soft:#8a6f73; --rose:#c76d6a; --gold:#b98a3e;
  --bg:#f7efea;
  --serif:'Cormorant Garamond',Georgia,serif;
  --script:'Pinyon Script',cursive;
  --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#eadbd3}
body{font-family:var(--serif);color:var(--ink);background:#eadbd3;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.app{position:relative;width:var(--w);margin:0 auto;background:
  radial-gradient(120% 60% at 50% 0%,#fbf5f1 0%,var(--bg) 60%,#f3e6df 100%);overflow-x:clip}

/* ---------------- gate (closed card) ---------------- */
#gate{position:fixed;top:0;bottom:0;left:50%;width:var(--w);transform:translateX(-50%);z-index:50;
  perspective:1500px;background:#efe1d9;cursor:pointer;-webkit-tap-highlight-color:transparent}
#gate.gone{display:none}
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;
  transition:transform 1.5s cubic-bezier(.62,.04,.28,1) .75s, filter 1.5s ease .75s;backface-visibility:hidden;will-change:transform}
.door .dimg{position:absolute;top:0;height:100%;width:200%;background-size:cover;background-position:center}
.door.l{left:0;transform-origin:0 50%} .door.l .dimg{left:0}
.door.r{right:0;transform-origin:100% 50%} .door.r .dimg{right:0}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(60,30,30,.12));opacity:0;transition:opacity 1.5s .75s}
.door.r::after{background:linear-gradient(270deg,rgba(0,0,0,0),rgba(60,30,30,.12))}
.rib{position:absolute;transition:transform .9s cubic-bezier(.6,0,.3,1);will-change:transform;filter:drop-shadow(0 2px 4px rgba(90,40,40,.25))}
.rib.vt,.rib.vb{left:50%;width:15%;margin-left:-7.5%;background-repeat:repeat-y;background-size:100% auto;background-position:center top}
.rib.vt{top:0;height:50%} .rib.vb{bottom:0;height:50%}
.rib.hl,.rib.hr{top:50%;height:calc(var(--w)*.15);margin-top:calc(var(--w)*-.075);background-image:none!important;background:none!important;overflow:hidden}
.rib .rot{position:absolute;left:50%;top:50%;width:calc(var(--w)*.15);height:calc(var(--w)*.5 + 4px);transform:translate(-50%,-50%) rotate(90deg);
  background-repeat:repeat-y;background-size:100% auto;background-position:center top}
.rib.hl{left:0;width:50%} .rib.hr{right:0;width:50%}
#bow{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-31%);transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .6s;
  filter:drop-shadow(0 8px 14px rgba(90,40,40,.3));z-index:2}
#bow img{width:100%;height:auto}
#tapHint{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:500 13px var(--sans);letter-spacing:.32em;
  text-transform:uppercase;color:#7a4c4c;z-index:3;transition:opacity .4s}
#tapHint span{display:inline-block;padding:9px 18px;border-radius:30px;background:rgba(255,248,244,.82);
  box-shadow:0 4px 18px rgba(120,60,60,.18);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#gate.o{background:transparent;transition:background .6s .7s}
#gate.o #tapHint{opacity:0}
#gate.o #bow{transform:translate(-50%,-60%) scale(1.25);opacity:0}
#gate.o .rib.hl{transform:translateX(-102%);transition-delay:.25s}
#gate.o .rib.hr{transform:translateX(102%);transition-delay:.25s}
#gate.o .rib.vt{transform:translateY(-102%);transition-delay:.4s}
#gate.o .rib.vb{transform:translateY(102%);transition-delay:.4s}
#gate.o .door.l{transform:rotateY(-104deg);filter:brightness(.9)}
#gate.o .door.r{transform:rotateY(104deg);filter:brightness(.9)}
#gate.o .door::after{opacity:1}
#gate.fade{opacity:0;transition:opacity .5s}

/* ---------------- 1. inner card ---------------- */
#s1{position:relative;height:100vh;height:100svh;overflow:hidden}
#s1 .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
#s1 .txt{position:absolute;left:14%;right:14%;top:24%;text-align:center}
.k1{font:500 12px var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--soft)}
.k2{font-family:var(--script);font-size:clamp(54px,16vw,76px);line-height:1.05;color:var(--rose);margin:8px 0 0}
.k3{font:500 clamp(24px,7vw,32px)/1 var(--serif);letter-spacing:.06em;color:var(--ink)}
.leaf{width:64px;height:auto;margin:16px auto 14px;opacity:.85}
.k4{font:500 15px var(--serif);font-style:italic;color:var(--soft)}
.k5{font:600 clamp(20px,6vw,26px) var(--serif);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.k5 i{font-weight:500;text-transform:none;letter-spacing:0;color:var(--rose);font-size:.8em;margin:0 6px}
#ringSpot{position:absolute;left:50%;top:69%;width:1px;height:1px}
.scrollHint{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;font:500 11px var(--sans);letter-spacing:.3em;
  text-transform:uppercase;color:var(--soft);opacity:.85}
.scrollHint b{display:block;width:1px;height:26px;margin:8px auto 0;background:linear-gradient(var(--soft),transparent);animation:drip 1.6s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------------- 2. falling ribbon ---------------- */
#s2{position:relative;height:230vh}
#s2 .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#curlWrap{position:absolute;left:50%;top:0;height:94%;transform:translateX(-50%);will-change:clip-path}
#curlWrap img{height:100%;width:auto}
#tag{position:absolute;left:0;right:0;top:44%;text-align:center;font:italic 500 22px var(--serif);color:var(--soft);opacity:0;
  transition:opacity .6s;pointer-events:none}

/* ---------------- 3. hands ---------------- */
#s3{position:relative;height:300vh}
#s3 .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#names{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0}
#names .n{font:600 clamp(26px,8vw,34px) var(--serif);letter-spacing:.16em;text-transform:uppercase}
#names .n i{font:italic 500 .7em var(--serif);letter-spacing:0;text-transform:none;color:var(--rose);margin:0 .35em}
#names .d{font:500 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-top:10px}
.hand{position:absolute;will-change:transform;filter:drop-shadow(0 10px 16px rgba(80,40,40,.18))}
.hand img{width:100%;height:auto}
#joke{position:absolute;left:0;right:0;text-align:center;font:600 clamp(22px,7vw,30px) var(--serif);letter-spacing:.12em;
  color:var(--rose);opacity:0;transform:scale(.6)}

/* ---------------- 4. timeline ---------------- */
#s4{position:relative;padding:22vh 0 10vh}
.hd{text-align:center;margin-bottom:46px}
.hd .k1{font-size:11px}
.hd h2{font:italic 500 clamp(32px,9.5vw,42px) var(--serif);margin-top:6px}
#tl{position:relative;margin:0 auto;width:100%}
#tlRib{position:absolute;left:50%;top:-30px;bottom:-30px;width:30px;margin-left:-15px;
  background:linear-gradient(90deg,#c9a24e 0,#e7c873 2px,#d27f7b 3px,#e9a19c 30%,#f7cfc9 48%,#eaa39e 62%,#cf7672 calc(100% - 3px),#e7c873 calc(100% - 2px),#b98a3e 100%);
  box-shadow:0 3px 8px rgba(120,50,50,.22)}
.ev{position:relative;height:150px}
.ev .dot{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:#fffaf7;
  box-shadow:0 2px 8px rgba(120,50,50,.28);display:grid;place-items:center;z-index:2;transition:transform .4s}
.ev .dot svg{width:17px;height:17px;stroke:var(--rose);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ev .t{position:absolute;top:50%;transform:translateY(-50%);width:calc(50% - 40px);opacity:.28;transition:opacity .5s, transform .5s}
.ev.L .t{right:calc(50% + 32px);text-align:right}
.ev.R .t{left:calc(50% + 32px);text-align:left}
.ev .tm{font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--rose)}
.ev .ti{font:italic 500 clamp(19px,5.6vw,23px)/1.15 var(--serif);margin-top:4px}
.ev .dy{font:500 12px var(--sans);color:var(--soft);margin-top:4px;letter-spacing:.05em}
.ev.on .t{opacity:1}
.ev.on .dot{transform:scale(1.12)}

/* ---------------- 5. venue ---------------- */
#s5{padding:10vh 22px 12vh;text-align:center}
.vcard{background:rgba(255,251,248,.78);border:1px solid rgba(185,138,62,.28);border-radius:22px;padding:34px 22px 30px;
  box-shadow:0 18px 40px rgba(120,60,60,.12);backdrop-filter:blur(4px)}
.vcard .k1{font-size:11px}
.vcard h3{font:500 clamp(28px,8vw,34px) var(--serif);margin:10px 0 6px}
.vcard p{font:italic 500 18px var(--serif);color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:12px 22px;border-radius:40px;background:var(--rose);color:#fff;
  text-decoration:none;font:500 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 20px rgba(199,109,106,.35)}
.btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.closing{font:italic 500 20px var(--serif);color:var(--soft);margin-top:44px}
.credit{display:block;margin-top:26px;font:500 10px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#b49a98;text-decoration:none}

/* ---------------- the travelling ring ---------------- */
#ring{position:fixed;left:0;top:0;width:64px;z-index:20;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 6px 8px rgba(90,50,30,.35));opacity:0}
#ring img{width:100%;height:auto}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s, transform .9s}
.reveal.in{opacity:1;transform:none}

/* ---- studio additions ---- */
:root{--names:var(--serif)}
#s1 .txt .k0{font:500 12px var(--sans);letter-spacing:.18em;color:var(--soft);margin-bottom:12px}
#s1 .sym{display:block;margin:0 auto 10px;height:auto}
#s1 .sym.sm{width:40px} #s1 .sym.md{width:56px} #s1 .sym.lg{width:76px}
#names .n{font-family:var(--names)}
.ev .pl{font:italic 500 14px/1.25 var(--serif);color:var(--soft);margin-top:4px}
.ev .mp{display:inline-block;margin-top:6px;font:500 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--rose);text-decoration:none;border-bottom:1px solid rgba(199,109,106,.4)}
.vcard .vn2{font:500 15px/1.5 var(--serif);color:var(--soft);margin-top:12px}
#rsvp{padding:0 22px 4vh}
.rcard{background:rgba(255,251,248,.85);border:1px solid rgba(185,138,62,.28);border-radius:22px;padding:30px 20px;box-shadow:0 18px 40px rgba(120,60,60,.12);text-align:center}
.rcard h3{font:italic 500 clamp(28px,8vw,34px) var(--serif);margin-bottom:6px}
.rcard .rn{font:italic 500 16px var(--serif);color:var(--soft);margin-bottom:16px}
.rcard input,.rcard textarea{width:100%;margin:6px 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(185,138,62,.35);background:#fffdfb;font:500 15px var(--sans);color:var(--ink)}
.rcard .yn{display:flex;gap:8px;margin:8px 0}
.rcard .yn button{flex:1;padding:11px 8px;border-radius:12px;border:1px solid rgba(199,109,106,.45);background:#fff;font:500 13px var(--sans);color:var(--ink)}
.rcard .yn button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.rcard .send{margin-top:12px;border:0;cursor:pointer}
.rcard .hp{position:absolute;left:-9999px}
#rMsg{font:500 13px var(--sans);color:#b3261e;margin-top:8px;min-height:1em}
.rcard .done{display:none;font:italic 500 19px var(--serif)}
.rcard.sent form{display:none} .rcard.sent .done{display:block}
#powered{margin-top:22px;font:500 11px/1.8 var(--sans);letter-spacing:.08em;color:#a88f8c}
#powered a{color:var(--rose);text-decoration:none}
#powered .cta{display:inline-block;margin-top:6px}
#powered .pblogo{display:block;height:34px;width:auto;margin:0 auto 6px}
body.indic .k1,body.indic .ev .tm,body.indic .scrollHint,body.indic #tapHint{letter-spacing:.04em;text-transform:none}
