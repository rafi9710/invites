<style>
:root{--names:'Pinyon Script','Great Vibes',cursive;--serif:'Cormorant Garamond',Georgia,serif;--caps:'Marcellus',Georgia,serif;--ar:'Amiri','Noto Naskh Arabic',serif;--ur:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;
  --ink:#4a1f1a;--ink2:#6b4a3a;--gold:#b08d57;--gold2:#d8bf8a;--paper:#f3eee5;--leaf:#a9a39a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;overflow-x:hidden;text-align:center}
body.locked{overflow:hidden;height:100%}
img{display:block;max-width:100%}
.caps{font-family:var(--caps);text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--ink2)}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}.d4{transition-delay:.48s}

/* paper with soft peony print */
.paper{position:relative;background-color:var(--paper);background-image:var(--pp);background-size:420px auto;background-repeat:repeat}
.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 45%,#f6f2ebf0 0%,#f4efe6d9 45%,#f1ebe100 100%);pointer-events:none}
.paper>*{position:relative}
.wrap{max-width:560px;margin:0 auto;padding:0 24px}

/* ---------- gate: the cover opens like two doors ---------- */
#gate{position:fixed;inset:0;z-index:60;perspective:1600px;background:#e9e2d6;overflow:hidden}
#gate .door{position:absolute;top:0;bottom:0;width:50%;background-size:200% 100%;background-repeat:no-repeat;transition:transform 2.2s cubic-bezier(.6,.02,.2,1),filter 2.2s;backface-visibility:hidden;box-shadow:0 0 40px #0002}
#gate .door.l{left:0;background-position:0 50%;transform-origin:left center}
#gate .door.r{right:0;background-position:100% 50%;transform-origin:right center}
#gate.open .door.l{transform:rotateY(-108deg);filter:brightness(.8)}
#gate.open .door.r{transform:rotateY(108deg);filter:brightness(.8)}
#gate .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#b08d5788,transparent);transition:opacity .6s}
#gate.open .mid,#gate.open .tap,#gate.open .seal{opacity:0;pointer-events:none}
#gate .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fbf6ec,#eadfca 60%,#d9c8a6);box-shadow:0 10px 30px #0003,inset 0 0 0 2px #b08d57,inset 0 0 0 7px #f6efe1,inset 0 0 0 8px #b08d5788;
  display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s;animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{transform:translate(-50%,-50%) scale(1.04)}}
#gate .seal img{width:66%;height:66%;object-fit:contain}
#gate .seal b{font-family:var(--names);font-weight:400;font-size:44px;color:var(--gold);line-height:1}
#gate .tap{position:absolute;left:0;right:0;bottom:max(46px,8vh);font-family:var(--caps);letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#5a3a2a;transition:opacity .6s}
#gate .tap span{display:inline-block;background:#f6f1e8e6;border:1px solid #b08d5788;padding:10px 18px}
#gate .drawn{position:absolute;inset:0;background:var(--pp) center/360px auto,#efe8dc}
#gate.gone{display:none}
#gate.hasc .seal{top:73%;width:96px;height:96px}
#gate.hasc .tap{bottom:max(28px,5vh)}

/* gold dust */
#dust{position:fixed;inset:0;z-index:5;pointer-events:none}

/* ---------- hero ---------- */
#hero{min-height:100svh;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 0 60px}
.mono{width:min(210px,52vw);margin:0 auto;overflow:visible}
.mono:has(.ini){width:auto}
.mono img{width:100%;filter:drop-shadow(0 6px 14px #b08d5733)}
.mono .ini{display:inline-block;padding:.12em .42em .2em;margin:0 -.3em;font-family:var(--names);font-size:120px;line-height:1.1;white-space:nowrap;background:linear-gradient(160deg,#d9bf86,#a8803f 55%,#cfae6c);-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto;width:min(240px,70%);color:var(--gold)}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.orn:after{background:linear-gradient(270deg,transparent,currentColor)}
.orn i{font-style:normal;font-size:12px}
#hero .names{font-family:var(--names);font-weight:400;font-size:clamp(46px,13vw,74px);line-height:1.05;color:var(--ink)}
#hero .names small{display:block;font-family:var(--serif);font-style:italic;font-size:.34em;color:var(--ink2);margin:.15em 0 .05em}
#hero .date{font-family:var(--caps);letter-spacing:.34em;font-size:13px;color:var(--ink2);margin-top:6px}
#hero .scroll{margin-top:44px;color:var(--ink2);font-size:10px}
#hero .scroll b{display:block;width:1px;height:38px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent);animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- card ---------- */
section{padding:70px 0}
.frame{position:relative;border:1px solid #b08d5766;padding:50px 22px 46px;background:#f7f3ecb3;backdrop-filter:blur(1px)}
.frame:before{content:"";position:absolute;inset:6px;border:1px solid #b08d5733;pointer-events:none}
.frame .c{position:absolute;width:26px;height:26px;color:var(--gold)}
.frame .c svg{width:100%;height:100%}
.c.tl{left:-1px;top:-1px}.c.tr{right:-1px;top:-1px;transform:scaleX(-1)}.c.bl{left:-1px;bottom:-1px;transform:scaleY(-1)}.c.br{right:-1px;bottom:-1px;transform:scale(-1)}
.bism{font-family:var(--ar);font-size:clamp(30px,8.4vw,42px);color:var(--ink);line-height:1.6;direction:rtl}
.bless{font-size:18.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.host{font-family:var(--names);font-size:clamp(30px,8.6vw,42px);color:var(--ink);margin:26px 0 6px;line-height:1.2}
.inv{font-style:italic;font-size:19px;color:var(--ink2);line-height:1.55;max-width:420px;margin:0 auto}
.pn{font-family:var(--names);font-size:clamp(42px,12vw,60px);color:var(--ink);line-height:1.15;margin-top:22px;white-space:nowrap}
.edu{font-family:var(--caps);font-size:11.5px;letter-spacing:.2em;color:var(--gold);margin-top:2px}
.with{font-style:italic;font-size:19px;color:var(--ink2);margin:14px 0 -6px}
.par{font-size:18.5px;color:var(--ink2);margin-top:8px;font-style:italic}
.insha{font-style:italic;font-size:19px;color:var(--ink2);margin-top:28px}
.dayrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;max-width:420px}
.dayrow span{flex:1;white-space:nowrap;font-family:var(--caps);font-size:clamp(10.5px,3vw,15px);letter-spacing:.08em;color:var(--ink);border-top:1px solid var(--ink2);border-bottom:1px solid var(--ink2);padding:5px 0}
.dayrow b{font-family:var(--caps);font-weight:400;font-size:clamp(42px,12vw,58px);color:var(--ink);line-height:1}
.dayrow b sup{font-size:.38em;vertical-align:super}
.hijri{font-style:italic;font-size:17.5px;color:var(--ink2);margin-top:8px}
.evl{margin-top:22px;display:grid;gap:4px}
.evl p{font-size:19.5px;color:var(--ink)}
.evl p em{font-style:normal;color:var(--ink2)}
.evl p small{display:block;font-style:italic;font-size:15.5px;color:var(--ink2)}
.evl a{color:var(--gold);font-size:14px;text-decoration:none;font-family:var(--caps);letter-spacing:.12em}

/* ---------- countdown ---------- */
.cdh{font-family:var(--names);font-size:clamp(34px,9.5vw,46px);color:var(--ink);line-height:1.2}
.cd{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.cd div{width:74px;height:74px;border-radius:50%;border:1px solid #b08d57aa;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f4ee;box-shadow:inset 0 0 0 4px #f8f4ee,inset 0 0 0 5px #b08d5744}
.cd b{font-family:var(--caps);font-weight:400;font-size:24px;color:var(--ink);line-height:1.1}
.cd span{font-family:var(--caps);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.cd.done{font-family:var(--names);font-size:32px;color:var(--ink)}

/* ---------- venue ---------- */
.arch{position:relative;margin:26px auto 0;max-width:340px;padding:70px 24px 34px;border:1px solid #b08d57aa;border-radius:170px 170px 4px 4px;background:#f8f4eecc}
.arch:before{content:"";position:absolute;inset:7px;border:1px solid #b08d5744;border-radius:164px 164px 2px 2px;pointer-events:none}
.arch .vn{font-family:var(--caps);font-size:clamp(19px,5.6vw,24px);letter-spacing:.12em;color:var(--ink);line-height:1.3}
.arch .va{font-size:19px;color:var(--ink2);margin-top:6px;font-style:italic}
.arch .note{font-size:16px;color:var(--ink2);margin-top:10px}
.btn{display:inline-flex;gap:10px;align-items:center;margin-top:22px;padding:13px 22px;border:1px solid var(--gold);color:var(--ink);text-decoration:none;font-family:var(--caps);letter-spacing:.24em;text-transform:uppercase;font-size:11px;background:#fffaf2;transition:.3s}
.btn:hover{background:#b08d571f}
.btn.cal{margin-left:6px}

/* ---------- urdu card ---------- */
.uh{font-family:var(--ur);font-size:clamp(28px,8vw,38px);color:var(--ink);line-height:2;direction:rtl}
.ucard{margin:18px auto 0;max-width:460px;padding:10px;background:#fbf8f2;border:1px solid #b08d5766;box-shadow:0 22px 40px -26px #4a1f1a66;cursor:zoom-in;transform:rotate(-1deg);transition:transform .5s}
.ucard:hover{transform:rotate(0)}
.ucard img{width:100%}
.utext{font-family:var(--ur);direction:rtl;white-space:pre-line;font-size:19px;line-height:2.3;color:var(--ink);margin-top:20px}
.hintz{margin-top:12px;font-size:14px;font-style:italic;color:var(--ink2)}
#lb{position:fixed;inset:0;z-index:80;background:#1d1310ee;display:none;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 20px 60px #000a}

/* ---------- footer ---------- */
.comp .t{font-style:italic;font-size:19px;color:var(--ink2)}
.comp .n{font-size:20px;color:var(--ink);margin-top:6px;line-height:1.5;white-space:pre-line}
.dua{font-family:var(--names);font-size:clamp(30px,8vw,40px);color:var(--ink);margin-top:34px}
.mini{width:84px;margin:26px auto 0;opacity:.95}
.mini .ini{font-size:56px}
#gate .seal b{display:inline-block;padding:0 .3em}
#powered{margin-top:30px;font-size:13.5px;color:var(--ink2);line-height:1.9}
#powered a{color:var(--ink)}
#powered .pblogo{height:30px;margin:0 auto 6px}
#powered .cta{display:inline-block;margin-top:6px;padding:8px 14px;border:1px solid #b08d5788;text-decoration:none;font-size:12px}
footer{padding:40px 0 60px}

/* corner flower */
.cflower{position:absolute;width:min(46vw,240px);pointer-events:none;opacity:.95;z-index:1}
.cflower.tr{right:-10px;top:-20px}.cflower.bl{left:-14px;bottom:-24px;transform:scale(-1,-1)}

/* petals */
.petal{position:fixed;top:-30px;z-index:4;pointer-events:none;width:14px;height:11px;border-radius:70% 30% 70% 30%;background:radial-gradient(circle at 30% 30%,#fffaf0,#e7dccb);box-shadow:0 1px 2px #0001;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}

#music{position:fixed;right:14px;bottom:14px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:#fbf7f0e6;color:var(--ink);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px #4a1f1a33}
#music.show{display:flex}
#music svg{width:18px;height:18px}
#music.playing{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #b08d5766}70%{box-shadow:0 0 0 12px #b08d5700}100%{box-shadow:0 0 0 0 #b08d5700}}
@media(min-width:900px){body{font-size:19px}section{padding:90px 0}.wrap{max-width:620px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* gold dust (gate + first screen) */
const dust = (function(){
  const cv = $('#dust'), ctx = cv.getContext('2d'); let W, H, on = !REDUCE; const P = [];
  const size = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 40; i++) P.push({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.6, v: .0001 + Math.random() * .0003, a: Math.random() * 6.28, o: .25 + Math.random() * .55 });
  const tick = () => { if (!on) return; ctx.clearRect(0, 0, W, H);
    for (const p of P){ p.y -= p.v; p.a += .01; if (p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
      ctx.globalAlpha = p.o * (.6 + .4 * Math.sin(p.a * 2)); ctx.fillStyle = '#c4a165'; ctx.beginPath(); ctx.arc((p.x + Math.sin(p.a) * .01) * W, p.y * H, p.r, 0, 6.29); ctx.fill(); }

  tick();
  return { stop(){ on = false; ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; } };
})();

const wait = ms => new Promise(r => setTimeout(r, ms));
function glide(to, ms){ return new Promise(res => { const from = scrollY, d = Math.max(0, Math.min(to, document.documentElement.scrollHeight - innerHeight)) - from, t0 = performance.now();
